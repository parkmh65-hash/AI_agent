<style>
:root{--bg-color: #080c14;--panel-bg: rgba(17,24,39,.7);--border-color: rgba(255,255,255,.08);--text-main: #f3f4f6;--text-sub: #9ca3af;--accent-blue: #3b82f6;--accent-green: #10b981;--accent-amber: #f59e0b;--accent-rose: #ef4444}body{margin:0;padding:0;font-family:Noto Sans KR,Outfit,sans-serif;background-color:var(--bg-color);color:var(--text-main);box-sizing:border-box}.dashboard-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;margin-bottom:24px}.stats-card{background:var(--panel-bg);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--border-color);border-radius:12px;padding:20px;box-shadow:0 4px 16px #0003;transition:border-color .2s ease}.stats-card:hover{border-color:#3b82f666}.badge{display:inline-block;padding:4px 10px;border-radius:6px;font-size:.75rem;font-weight:700;text-align:center}.badge-pending{background:#f59e0b26;color:var(--accent-amber);border:1px solid var(--accent-amber)}.badge-approved{background:#10b98126;color:var(--accent-green);border:1px solid var(--accent-green)}.badge-rejected{background:#ef444426;color:var(--accent-rose);border:1px solid var(--accent-rose)}.action-btn{padding:6px 12px;border-radius:6px;font-size:.78rem;font-weight:700;cursor:pointer;border:none;transition:opacity .2s ease}.action-btn:hover{opacity:.9}
