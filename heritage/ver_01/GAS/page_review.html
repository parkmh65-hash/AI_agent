<!-- page_review.html - 9. 나만의 문화유산 (후기쓰기) -->
<section id="page_review" class="tab-section">
  <div style="margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center;">
    <button class="btn-secondary" onclick="navigateTo('mypage')">
      ⬅️ 보관함으로 돌아가기
    </button>
  </div>

  <div class="glass-card" style="margin-bottom: 28px;">
    <div style="border-bottom: 1px solid var(--border-color); padding-bottom: 14px; margin-bottom: 20px;">
      <h1 id="reviewCourseTitle" style="font-size: 1.8rem; font-weight: 800; color: #fff;">탐방 후기 작성</h1>
      <p style="color: var(--text-sub); font-size: 0.9rem; margin-top: 4px;">
        다녀오신 문화유산 코스의 생생한 후기와 만족도를 작성하여 세종시민들과 공유해보세요.
      </p>
    </div>

    <!-- UX Design Decision Note:
         기획 노트의 "너무 작성 항목이 많은가?" 코멘트를 반영하여,
         사용자 이탈률을 방지하기 위해 필수 항목은 [사진 업로드], [감상 후기], [별점] 3가지로 최적화하고,
         나머지 편의시설 개선 의견(주차/화장실/식당)은 선택 작성으로 처리하였습니다. -->
    <form onsubmit="submitCourseReviewForm(event)" style="display: flex; flex-direction: column; gap: 24px;">
      
      <!-- Course Overall Section -->
      <div style="background: rgba(0,0,0,0.3); padding: 20px; border-radius: var(--radius-md); border: 1px solid var(--border-color);">
        <h3 style="font-size: 1.1rem; font-weight: 700; color: var(--accent-cyan); margin-bottom: 14px;">
          🌟 코스 종합 평가 & 만족도
        </h3>
        
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; margin-bottom: 14px;">
          <div>
            <label style="display: block; font-size: 0.88rem; color: var(--text-sub); margin-bottom: 4px;">코스 만족도 별점 <span style="color: var(--accent-cyan)">*</span></label>
            <select id="reviewOverallRating" style="width: 100%; padding: 10px; border-radius: 8px; background: #151e36; border: 1px solid var(--border-color); color: #fff;">
              <option value="5">⭐⭐⭐⭐⭐ 5점 (최상)</option>
              <option value="4">⭐⭐⭐⭐ 4점 (우수)</option>
              <option value="3">⭐⭐⭐ 3점 (보통)</option>
              <option value="2">⭐⭐ 2점 (아쉬움)</option>
              <option value="1">⭐ 1점 (개선필요)</option>
            </select>
          </div>

          <div>
            <label style="display: block; font-size: 0.88rem; color: var(--text-sub); margin-bottom: 4px;">누구와 방문하셨나요?</label>
            <select id="reviewCompanion" style="width: 100%; padding: 10px; border-radius: 8px; background: #151e36; border: 1px solid var(--border-color); color: #fff;">
              <option value="가족">👨‍👩‍👧 가족과 함께</option>
              <option value="연인/친구">💑 연인/친구와 함께</option>
              <option value="혼자">🧘 혼자서 힐링</option>
              <option value="단체/학생">🚌 동호회/학습 탐방</option>
            </select>
          </div>

          <div>
            <label style="display: block; font-size: 0.88rem; color: var(--text-sub); margin-bottom: 4px;">이동 교통수단</label>
            <input type="text" id="reviewTransport" value="승용차" style="width: 100%; padding: 10px; border-radius: 8px; background: rgba(0,0,0,0.3); border: 1px solid var(--border-color); color: #fff;" />
          </div>
        </div>

        <div>
          <label style="display: block; font-size: 0.88rem; color: var(--text-sub); margin-bottom: 4px;">전체 코스 총평 <span style="color: var(--accent-cyan)">*</span></label>
          <textarea id="reviewOverallText" rows="3" placeholder="코스 전체를 탐방하며 느낀 감상과 추천 포인트를 적어주세요." required style="width: 100%; padding: 12px; border-radius: 8px; background: rgba(0,0,0,0.3); border: 1px solid var(--border-color); color: #fff;"></textarea>
        </div>
      </div>

      <!-- Item Specific Repeated Blocks -->
      <div>
        <h3 style="font-size: 1.1rem; font-weight: 700; color: #fff; margin-bottom: 12px;">
          📸 개별 문화유산별 탐방 후기 및 편의시설 의견
        </h3>
        <div id="reviewHeritageItemsBlocks" style="display: flex; flex-direction: column; gap: 16px;">
          <!-- Dynamically populated via renderReviewView() -->
        </div>
      </div>

      <!-- Public Toggle & Submit Button -->
      <div style="display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border-color); padding-top: 18px; flex-wrap: wrap; gap: 14px;">
        <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
          <input type="checkbox" id="reviewPublicToggle" checked style="width: 18px; height: 18px; accent-color: var(--accent-cyan);" />
          <span style="font-size: 0.9rem; color: #fff; font-weight: 600;">공개 후기로 등록 (문화유산 검색 화면에 후기 요약 노출)</span>
        </label>

        <button type="submit" class="btn-primary" style="padding: 14px 28px; font-size: 1rem;">
          💾 후기 등록 완료하기
        </button>
      </div>
    </form>
  </div>
</section>

<script>
  var appState = window.appState = window.appState || { officialHeritages: [], citizenHeritages: [], likesMap: {}, courseList: [], savedCourses: [] };
  var currentReviewCourseObj = null;

  function renderReviewView(course) {
    if (!course) return;
    currentReviewCourseObj = course;

    document.getElementById('reviewCourseTitle').innerText = "탐방 후기 작성: " + (course.course_name || '문화유산 코스');

    var container = document.getElementById('reviewHeritageItemsBlocks');
    if (!container) return;

    var items = course.items || appState.officialHeritages.slice(0, 2);

    container.innerHTML = items.map(function(item, idx) {
      return '<div style="background: rgba(255,255,255,0.04); border: 1px solid var(--border-color); padding: 16px; border-radius: var(--radius-md);">' +
          '<h4 style="font-size: 1.05rem; font-weight: 700; color: var(--accent-cyan); margin-bottom: 10px;">' +
            '[유산 ' + (idx + 1) + '] ' + item.name + ' (' + (item.dong_eup_myeon || '세종시') + ')' +
          '</h4>' +
          '<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 10px;">' +
            '<div>' +
              '<label style="display: block; font-size: 0.8rem; color: var(--text-sub); margin-bottom: 4px;">사진 업로드 (Drive)</label>' +
              '<input type="file" class="review-item-photo" accept="image/*" style="width: 100%; font-size: 0.8rem; color: var(--text-muted);" />' +
            '</div>' +
            '<div>' +
              '<label style="display: block; font-size: 0.8rem; color: var(--text-sub); margin-bottom: 4px;">개별 추천 여부</label>' +
              '<label style="display: flex; align-items: center; gap: 6px; font-size: 0.85rem; color: #fff; margin-top: 6px;">' +
                '<input type="checkbox" class="review-item-recommend" checked /> 추천함 (추천 뱃지)' +
              '</label>' +
            '</div>' +
          '</div>' +
          '<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 8px; font-size: 0.82rem; color: var(--text-sub); background: rgba(0,0,0,0.25); padding: 10px; border-radius: 8px; margin-bottom: 10px;">' +
            '<label><input type="checkbox" class="review-item-parking" /> 🅿️ 주차장 개선필요</label>' +
            '<label><input type="checkbox" class="review-item-restroom" /> 🚻 화장실 개선필요</label>' +
            '<label><input type="checkbox" class="review-item-restaurant" /> 🍽️ 주변 식당 충분</label>' +
          '</div>' +
          '<div>' +
            '<textarea class="review-item-text" rows="2" placeholder="해당 문화유산 방문 느낀점을 적어주세요." style="width: 100%; padding: 10px; border-radius: 8px; background: rgba(0,0,0,0.3); border: 1px solid var(--border-color); color: #fff; font-size: 0.88rem;"></textarea>' +
          '</div>' +
        '</div>';
    }).join('');
  }

  function submitCourseReviewForm(e) {
    e.preventDefault();

    var rating = parseInt(document.getElementById('reviewOverallRating').value, 10) || 5;
    var companion = document.getElementById('reviewCompanion').value;
    var transport = document.getElementById('reviewTransport').value;
    var text = document.getElementById('reviewOverallText').value.trim();
    var isPublic = document.getElementById('reviewPublicToggle').checked;

    var reviewPayload = {
      review_id: "rev-" + Date.now(),
      course_id: currentReviewCourseObj ? (currentReviewCourseObj.course_id || currentReviewCourseObj.id) : 'course-1',
      heritage_id: (currentReviewCourseObj && currentReviewCourseObj.items && currentReviewCourseObj.items.length > 0) ? currentReviewCourseObj.items[0].id : null,
      rating: rating,
      companion: companion,
      companion_type: companion,
      transport: transport,
      text: text,
      content: text,
      review_text: text,
      is_public: isPublic,
      public_yn: isPublic ? 'Y' : 'N',
      created_at: new Date().toISOString()
    };

    showToast("🎉 탐방 후기가 Supabase DB(reviews)에 저장 중입니다...");

    var reviewApiUrl = (typeof getServerUrl === 'function') ? getServerUrl('/api/reviews') : null;
    if (reviewApiUrl) {
      fetch(reviewApiUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(reviewPayload)
      })
      .then(function(res) { return res.json(); })
      .then(function(data) {
        console.log('⚡ Server /api/reviews response:', data);
        showToast("✅ Supabase DB에 탐방 후기 및 별점이 정상 적재되었습니다!");
      })
      .catch(function(err) {
        console.warn('Server review API notice:', err);
      });
    }

    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run.withSuccessHandler(function() {
        navigateTo('mypage');
      }).submitCourseReviewGAS(reviewPayload);
    } else {
      setTimeout(function() {
        navigateTo('mypage');
      }, 500);
    }
  }
</script>
