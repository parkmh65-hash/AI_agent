<!-- page_status_citizen.html - 3. 문화유산 현황 (시민 문화유산) -->
<section id="page_status_citizen" class="tab-section">
  <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 24px; flex-wrap: wrap; gap: 14px;">
    <div>
      <h1 class="page-title">시민 제보 문화유산 현황</h1>
      <p class="page-desc">
        지정 등록 문화유산 외에 시민들의 참여 제보로 세종의 숨은 새로운 문화유산 DB를 함께 구축해 나가고 있습니다.
      </p>
    </div>

    <div style="display: flex; gap: 12px; align-items: center;">
      <span style="font-size: 0.9rem; color: var(--text-sub);">
        승인 노출 유산: <strong style="color: var(--accent-amber);" class="count-citizen-text">0</strong>건
      </span>
      <button class="btn-primary" onclick="openCitizenReportModal()">
        ✍️ 신규 문화유산 제보하기
      </button>
    </div>
  </div>

  <!-- Classification & Filter Control Bar (User ID & Time Filter) -->
  <div class="glass-card" style="margin-bottom: 20px; padding: 16px 20px; background: rgba(15, 23, 42, 0.6); display: flex; flex-wrap: wrap; gap: 16px; align-items: center; justify-content: space-between;">
    <div style="display: flex; gap: 14px; align-items: center; flex-wrap: wrap;">
      <!-- 사용자 ID 선택창 -->
      <div style="display: flex; align-items: center; gap: 8px;">
        <label for="citizenUserIdFilter" style="font-size: 0.88rem; color: var(--accent-cyan); font-weight: 700;">👤 사용자 ID 선택:</label>
        <select id="citizenUserIdFilter" onchange="filterAndRenderCitizenItems()" style="padding: 8px 14px; border-radius: 8px; background: #151e36; border: 1px solid var(--border-color); color: #fff; font-size: 0.88rem; outline: none;">
          <option value="all">전체 사용자 (All Users)</option>
          <option value="user_01">내 ID (user_01)</option>
          <option value="user_sejong_02">시민 제보자 A (user_sejong_02)</option>
          <option value="user_sejong_03">시민 제보자 B (user_sejong_03)</option>
        </select>
      </div>

      <!-- 시간별 분류 선택창 -->
      <div style="display: flex; align-items: center; gap: 8px;">
        <label for="citizenTimeFilter" style="font-size: 0.88rem; color: var(--accent-amber); font-weight: 700;">⏰ 시간별 분류:</label>
        <select id="citizenTimeFilter" onchange="filterAndRenderCitizenItems()" style="padding: 8px 14px; border-radius: 8px; background: #151e36; border: 1px solid var(--border-color); color: #fff; font-size: 0.88rem; outline: none;">
          <option value="newest">최신 제보순 (Newest)</option>
          <option value="oldest">오래된 제보순 (Oldest)</option>
          <option value="today">오늘 제보건</option>
          <option value="week">이번 주 제보건</option>
          <option value="month">이번 달 제보건</option>
        </select>
      </div>
    </div>

    <div style="font-size: 0.82rem; color: var(--text-muted);">
      🔍 사용자 ID / 시간별 필터 적용 지원
    </div>
  </div>

  <!-- Approved Citizen Heritages Grid -->
  <div id="citizenApprovedGrid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px;">
    <!-- Rendered via renderStatusCitizenView() -->
  </div>

  <!-- Citizen Report Modal Form -->
  <div id="citizenReportModal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
      <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 14px; margin-bottom: 18px;">
        <h2 style="font-size: 1.3rem; font-weight: 800; color: var(--accent-cyan);">
          🌱 시민 문화유산 발굴 제보서
        </h2>
      </div>

      <form onsubmit="submitCitizenHeritageForm(event)" style="display: flex; flex-direction: column; gap: 16px;">
        <div>
          <label style="display: block; font-size: 0.88rem; color: var(--text-sub); margin-bottom: 6px; font-weight: 600;">
            문화유산 명칭 <span style="color: var(--accent-cyan)">*</span>
          </label>
          <input type="text" id="citFormName" placeholder="예: 금남면 용포리 옛 우물터" required style="width: 100%; padding: 12px; border-radius: var(--radius-md); background: rgba(0,0,0,0.3); border: 1px solid var(--border-color); color: #fff;" />
        </div>

        <div>
          <label style="display: block; font-size: 0.88rem; color: var(--text-sub); margin-bottom: 6px; font-weight: 600;">
            정확한 위치 / 소재지 주소 <span style="color: var(--accent-cyan)">*</span>
          </label>
          <input type="text" id="citFormAddress" placeholder="예: 세종특별자치시 금남면 용포리 12" required style="width: 100%; padding: 12px; border-radius: var(--radius-md); background: rgba(0,0,0,0.3); border: 1px solid var(--border-color); color: #fff;" />
        </div>

        <div>
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
            <label style="font-size: 0.88rem; color: var(--text-sub); font-weight: 600;">
              GPS 좌표 (위도 / 경도)
            </label>
            <button type="button" class="btn-secondary" onclick="acquireCurrentGPSLocation()" style="padding: 6px 12px; font-size: 0.8rem; border-color: var(--accent-cyan); color: var(--accent-cyan);">
              📍 현재 위치 GPS 수집
            </button>
          </div>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <div>
              <label style="font-size: 0.78rem; color: var(--text-muted); display: block; margin-bottom: 4px;">위도 (Lat)</label>
              <input type="text" id="citFormLat" value="36.4800" readonly style="width: 100%; padding: 10px; border-radius: 8px; background: rgba(0,0,0,0.4); border: 1px solid var(--border-color); color: var(--text-main); font-size: 0.88rem;" />
            </div>
            <div>
              <label style="font-size: 0.78rem; color: var(--text-muted); display: block; margin-bottom: 4px;">경도 (Lng)</label>
              <input type="text" id="citFormLng" value="127.2800" readonly style="width: 100%; padding: 10px; border-radius: 8px; background: rgba(0,0,0,0.4); border: 1px solid var(--border-color); color: var(--text-main); font-size: 0.88rem;" />
            </div>
          </div>
        </div>

        <div>
          <label style="display: block; font-size: 0.88rem; color: var(--text-sub); margin-bottom: 6px; font-weight: 600;">
            추천 이유 및 역사적 가치 <span style="color: var(--accent-cyan)">*</span>
          </label>
          <textarea id="citFormReason" rows="3" placeholder="해당 문화유산의 역사적 배경, 주민 생활 가치, 보존 필요성을 자세히 기재해 주세요." required style="width: 100%; padding: 12px; border-radius: var(--radius-md); background: rgba(0,0,0,0.3); border: 1px solid var(--border-color); color: #fff;"></textarea>
        </div>

        <div>
          <label style="display: block; font-size: 0.88rem; color: var(--text-sub); margin-bottom: 6px; font-weight: 600;">
            사진 업로드 (Google Drive 저장)
          </label>
          <input type="file" id="citFormPhoto" accept="image/*" style="width: 100%; padding: 8px; border-radius: var(--radius-md); background: rgba(0,0,0,0.3); border: 1px solid var(--border-color); color: var(--text-sub); font-size: 0.85rem;" />
        </div>

        <div style="background: rgba(0,245,212,0.08); border: 1px solid rgba(0,245,212,0.2); padding: 12px; border-radius: 10px; font-size: 0.82rem; color: var(--accent-cyan);">
          📌 <b>제보 안내:</b> 제출 시 상태는 <b>'대기'</b>로 등록되며, 담당자 현장 확인 후 승인 시 공공 목록에 노출됩니다. 제출 현황은 <b>[나만의 문화유산 > 내가 추천한 문화유산]</b>에서 본인 확인이 가능합니다.
        </div>

        <div style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 8px;">
          <button type="button" class="btn-secondary" onclick="closeCitizenReportModal()" style="padding: 10px 18px;">취소</button>
          <button type="submit" class="btn-primary" style="padding: 10px 18px; width: auto;">제보 제출하기</button>
        </div>
      </form>
    </div>
  </div>
</section>

<script>
  window.rawCitizenItems = [];

  function filterAndRenderCitizenItems() {
    var userIdFilter = document.getElementById('citizenUserIdFilter') ? document.getElementById('citizenUserIdFilter').value : 'all';
    var timeFilter = document.getElementById('citizenTimeFilter') ? document.getElementById('citizenTimeFilter').value : 'newest';

    var items = (window.rawCitizenItems && window.rawCitizenItems.length > 0)
      ? window.rawCitizenItems.slice()
      : (appState.citizenHeritages || []);

    if (!items || items.length === 0) {
      var grid = document.getElementById('citizenApprovedGrid');
      if (grid) {
        grid.innerHTML = '<div class="glass-card" style="grid-column: 1/-1; text-align: center; color: var(--text-sub);">조건에 일치하는 시민 제보 문화유산이 없습니다.</div>';
      }
      var countBadgeZero = document.querySelector('.count-citizen-text');
      if (countBadgeZero) countBadgeZero.innerText = '0';
      return;
    }

    // Filter by User ID
    if (userIdFilter !== 'all') {
      items = items.filter(function(item) {
        var uid = item.user_id || item.submitted_by || item.reporter_id || 'user_01';
        return String(uid) === String(userIdFilter) || (userIdFilter === 'user_01' && (!item.user_id || item.user_id === 'user_01'));
      });
    }

    // Filter/Sort by Time
    var now = new Date();
    if (timeFilter === 'today') {
      items = items.filter(function(item) {
        if (!item.submitted_at && !item.created_at) return true;
        var d = new Date(item.submitted_at || item.created_at);
        return d.toDateString() === now.toDateString();
      });
    } else if (timeFilter === 'week') {
      var weekAgo = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000);
      items = items.filter(function(item) {
        if (!item.submitted_at && !item.created_at) return true;
        var d = new Date(item.submitted_at || item.created_at);
        return d >= weekAgo;
      });
    } else if (timeFilter === 'month') {
      var monthAgo = new Date(now.getTime() - 30 * 24 * 60 * 60 * 1000);
      items = items.filter(function(item) {
        if (!item.submitted_at && !item.created_at) return true;
        var d = new Date(item.submitted_at || item.created_at);
        return d >= monthAgo;
      });
    }

    if (timeFilter === 'oldest') {
      items.sort(function(a, b) {
        var da = new Date(a.submitted_at || a.created_at || 0);
        var db = new Date(b.submitted_at || b.created_at || 0);
        return da - db;
      });
    } else if (timeFilter === 'newest') {
      items.sort(function(a, b) {
        var da = new Date(a.submitted_at || a.created_at || 0);
        var db = new Date(b.submitted_at || b.created_at || 0);
        return db - da;
      });
    }

    renderCitizenGridItems(items);
  }

  function renderCitizenGridItems(items) {
    var grid = document.getElementById('citizenApprovedGrid');
    if (!grid) return;

    if (!items || !Array.isArray(items) || items.length === 0) {
      grid.innerHTML = '<div class="glass-card" style="grid-column: 1/-1; text-align: center; color: var(--text-sub);">현재 등록되거나 필터링 조건에 일치하는 시민 제보 문화유산(citizen_recommendations)이 없습니다.</div>';
      var countBadgeZero = document.querySelector('.count-citizen-text');
      if (countBadgeZero) countBadgeZero.innerText = '0';
      return;
    }

    var countBadge = document.querySelector('.count-citizen-text');
    if (countBadge) {
      countBadge.innerText = items.length;
    }

    grid.innerHTML = items.map(function(h, idx) {
      var statusBadgeClass = (h.status === '승인' || h.status === 'approved') ? 'badge-citizen' : 'badge-era';
      var statusText = h.status || '신청중';
      var rawPhoto = h.photo_url || h.image_url;
      var hasPhoto = rawPhoto && typeof rawPhoto === 'string' && rawPhoto.trim() !== '' && rawPhoto !== 'null' && rawPhoto !== 'undefined';
      var photoHtml = hasPhoto
        ? '<img src="' + rawPhoto + '" style="width: 100%; height: 160px; object-fit: cover; border-radius: var(--radius-md); margin-bottom: 12px;" alt="citizen_recommendation" />'
        : '<div style="width: 100%; height: 160px; background: rgba(255, 255, 255, 0.04); border: 1px dashed var(--border-color); border-radius: var(--radius-md); margin-bottom: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text-muted); font-size: 0.88rem; font-weight: 600;"><span style="font-size: 1.6rem; margin-bottom: 4px;">📷</span><span>사진 없음</span></div>';

      var itemAddress = h.address || h.dong || '세종특별자치시';
      var itemReason = h.reason || h.description || h.thinking_point || '시민 제보 문화유산';
      var cardId = h.id || idx;
      var titleName = h.name || '미정 유산명';
      var safeName = titleName.replace(/'/g, "\\'");
      var baseHeart = (h.heart !== undefined && h.heart !== null) ? h.heart : (h.like_count || h.recommend_count || 1);
      var currentHeart = baseHeart + (appState.likesMap[cardId] || appState.likesMap[titleName] || 0);
      var displayUser = h.user_id || h.submitted_by || 'user_01';
      var displayTime = (h.submitted_at || h.created_at) ? new Date(h.submitted_at || h.created_at).toLocaleDateString() : '최근';

      return '<div class="glass-card">' +
          photoHtml +
          '<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">' +
            '<span class="badge ' + statusBadgeClass + '">🌱 시민 제보 (' + statusText + ')</span>' +
            '<button class="btn-like" onclick="toggleLike(\'' + cardId + '\', event, \'' + safeName + '\')">' +
              '❤️ <span class="like-count-' + cardId + '" data-base-likes="' + baseHeart + '" data-item-name="' + safeName + '">' + currentHeart + '</span>' +
            '</button>' +
          '</div>' +
          '<h3 style="font-size: 1.15rem; font-weight: 700; color: #fff; margin-bottom: 6px;">' + titleName + '</h3>' +
          '<p style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 4px;">📍 ' + itemAddress + '</p>' +
          '<div style="display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--accent-cyan); margin-bottom: 8px;">' +
            '<span>👤 ID: ' + displayUser + '</span>' +
            '<span>📅 ' + displayTime + '</span>' +
          '</div>' +
          '<p style="font-size: 0.82rem; color: var(--text-sub); line-height: 1.5; height: 38px; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;">' +
            itemReason +
          '</p>' +
        '</div>';
    }).join('');
  }

  function renderStatusCitizenView() {
    var grid = document.getElementById('citizenApprovedGrid');
    if (!grid) return;
    grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: var(--accent-cyan); padding: 20px;">☁️ citizen_recommendations 테이블에서 최신 시민 제보 유산을 로딩 중입니다...</div>';

    function handleLoadedItems(items) {
      window.rawCitizenItems = items || [];
      filterAndRenderCitizenItems();
    }

    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(function(res) {
          if (res && res.data && Array.isArray(res.data) && res.data.length > 0) {
            handleLoadedItems(res.data);
          } else if (res && Array.isArray(res) && res.length > 0) {
            handleLoadedItems(res);
          } else {
            fetchDirectCitizenRecommendations(handleLoadedItems);
          }
        })
        .withFailureHandler(function() {
          fetchDirectCitizenRecommendations(handleLoadedItems);
        })
        .fetchCitizenRecommendationsGAS();
    } else {
      fetchDirectCitizenRecommendations(handleLoadedItems);
    }
  }

  async function fetchDirectCitizenRecommendations(callback) {
    var supabaseUrl = 'https://pdpmtgnagwzcsftavtap.supabase.co';
    var supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBkcG10Z25hZ3d6Y3NmdGF2dGFwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NTA4NjYsImV4cCI6MjA5NDQyNjg2Nn0.eA_TDXZ8GRR4HbDCkX5A-rvWPx3Bz_KEyxSev1MF2qM';
    var url = supabaseUrl + '/rest/v1/citizen_recommendations?select=*&limit=10';

    try {
      var response = await fetch(url, {
        method: 'GET',
        headers: {
          'apikey': supabaseKey,
          'Authorization': 'Bearer ' + supabaseKey,
          'Accept': 'application/json'
        }
      });

      var responseText = await response.text();
      console.log('citizen_recommendations status:', response.status);
      console.log('citizen_recommendations response:', responseText);

      if (!response.ok) {
        console.error('시민 추천 데이터 조회 실패:', response.status, responseText);
        callback([]);
        return;
      }

      var data = [];
      if (responseText && typeof responseText === 'string' && (responseText.trim().startsWith('[') || responseText.trim().startsWith('{'))) {
        try { data = JSON.parse(responseText); } catch (e) {}
      }
      callback(Array.isArray(data) ? data : []);
    } catch (err) {
      console.error('Direct citizen_recommendations fetch exception:', err);
      callback([]);
    }
  }

  window.renderStatusCitizenViewImpl = renderStatusCitizenView;
  window.renderStatusCitizenView = renderStatusCitizenView;

  window.openCitizenReportModalImpl = function () {
    var modal = document.getElementById('citizenReportModal');
    if (!modal) {
      console.error('ID가 citizenReportModal인 모달 요소가 없습니다.');
      return;
    }
    modal.style.display = 'flex';
  };
  window.openCitizenReportModal = window.openCitizenReportModalImpl;

  window.closeCitizenReportModalImpl = function () {
    var modal = document.getElementById('citizenReportModal');
    if (modal) {
      modal.style.display = 'none';
    }
  };
  window.closeCitizenReportModal = window.closeCitizenReportModalImpl;

  function acquireCurrentGPSLocation() {
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(function(pos) {
        document.getElementById('citFormLat').value = pos.coords.latitude.toFixed(4);
        document.getElementById('citFormLng').value = pos.coords.longitude.toFixed(4);
        showToast("📍 현재 위치 좌표를 수집했습니다!");
      }, function() {
        showToast("GPS 좌표 취득 실패 (기본 세종시 좌표 사용)");
      });
    }
  }

  async function uploadCitizenPhotoToSupabaseStorage(file) {
    var supabaseUrl = 'https://pdpmtgnagwzcsftavtap.supabase.co';
    var supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBkcG10Z25hZ3d6Y3NmdGF2dGFwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NTA4NjYsImV4cCI6MjA5NDQyNjg2Nn0.eA_TDXZ8GRR4HbDCkX5A-rvWPx3Bz_KEyxSev1MF2qM';
    var bucketName = 'heritage-images';

    var cleanName = (file.name || 'photo.jpg').replace(/[^a-zA-Z0-9_\.\-]/g, '_');
    var safeFileName = 'cit_' + Date.now() + '_' + cleanName;
    var uploadUrl = supabaseUrl + '/storage/v1/object/' + bucketName + '/' + safeFileName;

    var response = await fetch(uploadUrl, {
      method: 'POST',
      headers: {
        'apikey': supabaseKey,
        'Authorization': 'Bearer ' + supabaseKey,
        'Content-Type': file.type || 'image/jpeg',
        'x-upsert': 'true'
      },
      body: file
    });

    if (response.ok || response.status === 200 || response.status === 201) {
      return supabaseUrl + '/storage/v1/object/public/' + bucketName + '/' + safeFileName;
    } else {
      console.warn('Supabase Storage photo upload HTTP status:', response.status);
      return null;
    }
  }

  async function submitCitizenHeritageForm(e) {
    e.preventDefault();
    var name = document.getElementById('citFormName').value.trim();
    var address = document.getElementById('citFormAddress').value.trim();
    var reason = document.getElementById('citFormReason').value.trim();
    var lat = parseFloat(document.getElementById('citFormLat').value) || 36.4800;
    var lng = parseFloat(document.getElementById('citFormLng').value) || 127.2800;
    var photoInput = document.getElementById('citFormPhoto');

    if (!name) {
      alert('문화유산 명칭을 입력해 주세요.');
      return;
    }
    if (!address) {
      alert('소재지 주소를 입력해 주세요.');
      return;
    }
    if (!reason) {
      alert('추천 이유 및 역사적 가치를 입력해 주세요.');
      return;
    }

    var uploadedPhotoUrl = null;
    if (photoInput && photoInput.files && photoInput.files.length > 0) {
      showToast("☁️ 1/2: 선택한 이미지를 Supabase Storage에 업로드하고 있습니다...");
      try {
        uploadedPhotoUrl = await uploadCitizenPhotoToSupabaseStorage(photoInput.files[0]);
      } catch (err) {
        console.warn('Photo upload exception:', err);
      }
    }

    var newRecord = {
      name: name,
      address: address,
      description: reason,
      latitude: lat,
      longitude: lng,
      image_url: uploadedPhotoUrl,
      user_id: (window.appState && window.appState.user_email) ? window.appState.user_email : "user_01",
      status: "신청중",
      recommend_count: 1,
      heart: 1
    };

    closeCitizenReportModal();
    showToast("☁️ 2/2: Supabase DB(citizen_recommendations)에 제보서를 저장하고 있습니다...");

    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(function(res) {
          if (res && res.status === 'success') {
            showToast("✅ 시민제보(citizen_recommendations)가 Supabase DB에 성공적으로 저장되었습니다!");
          } else {
            saveDirectToSupabase(newRecord);
          }
          renderStatusCitizenView();
        })
        .withFailureHandler(function(err) {
          console.warn('GAS submit failed, trying direct Supabase REST:', err);
          saveDirectToSupabase(newRecord);
        })
        .submitCitizenRecommendationGAS(newRecord);
    } else {
      saveDirectToSupabase(newRecord);
    }
  }

  function sanitizePayload(source) {
    var result = {};
    Object.keys(source || {}).forEach(function (key) {
      var value = source[key];
      if (value === undefined) return;
      if (typeof Blob !== 'undefined' && (value instanceof Blob || (typeof File !== 'undefined' && value instanceof File))) {
        console.warn('전송 제외: ' + key + '는 Blob/File 객체입니다.');
        return;
      }
      if (typeof value === 'string') {
        result[key] = value.trim() || null;
        return;
      }
      result[key] = value;
    });
    return result;
  }

  async function saveDirectToSupabase(rawRecord) {
    var payload = sanitizePayload(rawRecord);

    // 1. Try FastAPI Server API first
    var serverUrl = (typeof getServerUrl === 'function') ? getServerUrl('/api/citizen-recommendations') : null;
    if (serverUrl) {
      try {
        var sRes = await fetch(serverUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        if (sRes.ok) {
          var sData = await sRes.json();
          console.log('⚡ Server /api/citizen-recommendations response:', sData);
          showToast('✅ 서버 경유 Supabase DB(citizen_recommendations)에 제보가 접수되었습니다!');
          renderStatusCitizenView();
          return;
        }
      } catch (se) {
        console.warn('FastAPI server citizen post notice:', se);
      }
    }

    // 2. Direct Supabase REST Fallback
    var supabaseUrl = 'https://pdpmtgnagwzcsftavtap.supabase.co';
    var supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBkcG10Z25hZ3d6Y3NmdGF2dGFwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NTA4NjYsImV4cCI6MjA5NDQyNjg2Nn0.eA_TDXZ8GRR4HbDCkX5A-rvWPx3Bz_KEyxSev1MF2qM';
    var url = supabaseUrl + '/rest/v1/citizen_recommendations';

    try {
      var response = await fetch(url, {
        method: 'POST',
        headers: {
          'apikey': supabaseKey,
          'Authorization': 'Bearer ' + supabaseKey,
          'Content-Type': 'application/json',
          'Accept': 'application/json',
          'Prefer': 'return=representation'
        },
        body: JSON.stringify(payload)
      });

      var responseText = await response.text();
      if (!response.ok) {
        showToast('❌ Supabase POST 실패: ' + response.status + ' ' + responseText);
      } else {
        showToast('✅ Supabase DB(citizen_recommendations)에 제보가 성공적으로 저장되었습니다!');
      }
      renderStatusCitizenView();
    } catch (err) {
      console.error('Direct Supabase insert exception:', err);
      renderStatusCitizenView();
    }
  }
