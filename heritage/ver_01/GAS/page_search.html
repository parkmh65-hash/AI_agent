<!-- page_search.html - 4. 문화유산 검색 -->
<section id="page_search" class="tab-section">
  <div style="margin-bottom: 24px;">
    <h1 class="page-title">세종시 문화유산 검색</h1>
    <p class="page-desc">키워드 및 읍·면·동 필터, AI 자연어 탐색으로 세종의 문화유산을 신속히 찾아보세요.</p>
  </div>

  <!-- Search Filter Panel -->
  <div class="glass-card" style="margin-bottom: 28px;">
    <div style="display: grid; grid-template-columns: 2fr 1fr auto; gap: 12px; align-items: center;">
      <input type="text" id="searchQueryInput" placeholder="문화유산명, 시대, 키워드 입력 (예: 연기아문, 극락보전, 조선전기...)" style="padding: 12px 16px; border-radius: var(--radius-md); background: rgba(0,0,0,0.3); border: 1px solid var(--border-color); color: #fff; font-size: 0.95rem;" onkeyup="if(event.key==='Enter') executeSearch()" />
      
      <select id="searchDongSelect" style="padding: 12px 14px; border-radius: var(--radius-md); background: #151e36; border: 1px solid var(--border-color); color: #fff; font-size: 0.95rem;" onchange="executeSearch()">
        <option value="">전체 읍·면·동</option>
        <option value="연기면">연기면</option>
        <option value="전의면">전의면</option>
        <option value="어진동">어진동</option>
        <option value="연동면">연동면</option>
        <option value="장군면">장군면</option>
        <option value="금남면">금남면</option>
      </select>

      <button class="btn-primary" onclick="executeSearch()" style="padding: 12px 24px;">
        🔍 검색하기
      </button>
    </div>
  </div>

  <!-- Search Result & Popular Heritage List (Likes Sorted) -->
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
    <h3 style="font-size: 1.25rem; font-weight: 700; color: #fff;">
      🔥 인기 문화유산 목록 (좋아요순 정렬)
    </h3>
    <span id="searchResultsCount" style="font-size: 0.88rem; color: var(--text-sub);">결과 0건</span>
  </div>

  <div id="searchResultsGrid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px;">
    <!-- Rendered via renderSearchView() -->
  </div>
</section>

<script>
  var appState = window.appState = window.appState || { officialHeritages: [], citizenHeritages: [], likesMap: {}, courseList: [], savedCourses: [] };

  function renderSearchView() {
    executeSearch();
  }

  function executeSearch() {
    var queryEl = document.getElementById('searchQueryInput');
    var dongEl = document.getElementById('searchDongSelect');
    var query = queryEl ? queryEl.value.trim().toLowerCase() : '';
    var selectedDong = dongEl ? dongEl.value : '';

    var allHeritages = [];
    appState.officialHeritages.forEach(function(h) {
      allHeritages.push({
        id: h.id,
        name: h.name,
        type: 'official',
        era: h.era_normalized || h.era || '조선시대',
        dong: h.dong_eup_myeon,
        address: h.address,
        description: h.description,
        image_url: h.image_url,
        like_count: (h.like_count || 100) + (appState.likesMap[h.id] || 0),
        rawObj: h
      });
    });

    appState.citizenHeritages.filter(function(c) { return c.status === '승인'; }).forEach(function(c) {
      allHeritages.push({
        id: c.id,
        name: c.name,
        type: 'citizen',
        era: '시민제보',
        dong: c.address.includes('연기면') ? '연기면' : c.address.includes('전의면') ? '전의면' : c.address.includes('금남면') ? '금남면' : '세종시',
        address: c.address,
        description: c.reason,
        image_url: c.image_url || 'https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=600&q=80',
        like_count: (c.like_count || 20) + (appState.likesMap[c.id] || 0),
        rawObj: c
      });
    });

    // Filter logic
    var filtered = allHeritages.filter(function(item) {
      var matchQuery = !query || item.name.toLowerCase().includes(query) || item.description.toLowerCase().includes(query) || item.era.toLowerCase().includes(query);
      var matchDong = !selectedDong || item.dong === selectedDong || item.address.includes(selectedDong);
      return matchQuery && matchDong;
    });

    // Sort by likes descending
    filtered.sort(function(a, b) { return b.like_count - a.like_count; });

    var countEl = document.getElementById('searchResultsCount');
    if (countEl) countEl.innerText = "검색 결과 " + filtered.length + "건";

    var grid = document.getElementById('searchResultsGrid');
    if (!grid) return;

    if (!filtered.length) {
      grid.innerHTML = '<div class="glass-card" style="grid-column: 1/-1; text-align: center; color: var(--text-sub);">일치하는 문화유산이 없습니다. 검색어를 변경해 보세요.</div>';
      return;
    }

    grid.innerHTML = filtered.map(function(item) {
      var badgeHtml = item.type === 'official' ?
        '<span class="badge badge-era">' + item.era + '</span> <span class="badge badge-dong">' + item.dong + '</span>' :
        '<span class="badge badge-citizen">시민 제보 유산</span>';

      return '<div class="glass-card" style="display: flex; flex-direction: column;">' +
          '<img src="' + item.image_url + '" style="width: 100%; height: 160px; object-fit: cover; border-radius: var(--radius-md); margin-bottom: 12px;" />' +
          '<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">' +
            '<div>' + badgeHtml + '</div>' +
            '<button class="btn-like" onclick="toggleLike(\'' + item.id + '\', event)">' +
              '❤️ <span class="like-count-' + item.id + '" data-base-likes="' + item.like_count + '">' + item.like_count + '</span>' +
            '</button>' +
          '</div>' +
          '<h3 style="font-size: 1.15rem; font-weight: 700; color: #fff; margin-bottom: 4px;">' + item.name + '</h3>' +
          '<p style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 8px;">📍 ' + item.address + '</p>' +
          '<p style="font-size: 0.82rem; color: var(--text-sub); line-height: 1.5; height: 38px; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; margin-bottom: 14px;">' +
            item.description +
          '</p>' +
          '<div style="display: flex; gap: 8px; margin-top: auto;">' +
            '<button class="btn-secondary" style="flex: 1; justify-content: center; font-size: 0.85rem;" onclick="openSearchDetailById(\'' + item.id + '\')">' +
              '🔍 상세 정보 더보기' +
            '</button>' +
          '</div>' +
        '</div>';
    }).join('');
  }
</script>
