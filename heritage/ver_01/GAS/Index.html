  <script>
    // Server Backend Endpoint Configuration (Cloud Run / NestJS Server)
    window.CLOUD_RUN_SERVER_URL = "<?= (typeof getCloudRunBackendUrl === 'function') ? getCloudRunBackendUrl() : 'https://heritage-538192513096.us-central1.run.app' ?>";
    
    function getServerUrl(path) {
      var baseUrl = window.CLOUD_RUN_SERVER_URL || 'https://heritage-538192513096.us-central1.run.app';
      if (!path) return baseUrl;
      if (!path.startsWith('/')) path = '/' + path;
      return baseUrl.replace(/\/$/, '') + path;
    }

    // Global Safe Fail-safe Guard & Fallback for navigateTo, view renderers and OAuth script dialogs
    window.onerror = function(msg, url, line, col, error) {
      console.warn("GCP/WebApp Guarded Exception Ignored:", msg, "at line:", line);
      return true;
    };

    // Early declaration of showToast to prevent ReferenceErrors during early DOM rendering
    window.showToast = window.showToast || function(msg) {
      var container = document.getElementById('toastContainer');
      if (!container) {
        container = document.createElement('div');
        container.id = 'toastContainer';
        document.body.appendChild(container);
      }
      var toast = document.createElement('div');
      toast.className = 'toast';
      toast.innerText = msg;
      container.appendChild(toast);
      setTimeout(function () {
        if (toast.parentNode) toast.parentNode.removeChild(toast);
      }, 3000);
    };

    window.appState = window.appState || {
      currentTab: 'home',
      officialHeritages: [],
      citizenHeritages: [],
      selectedHeritageDetail: null,
      courseList: [],
      savedCourses: [],
      myCitizenSubmissions: [],
      likesMap: {},
      previousTab: 'home',
      scrollPositionMap: {}
    };
    var appState = window.appState;

    window.renderHomeView = window.renderHomeView || function() {};
    window.renderStatusOfficialView = window.renderStatusOfficialView || function() {};
    window.renderStatusCitizenView = window.renderStatusCitizenView || function() {};
    window.renderSearchView = window.renderSearchView || function() {};
    window.renderSearchDetailView = window.renderSearchDetailView || function() {};
    window.renderCourseView = window.renderCourseView || function() {};
    window.renderMyPageView = window.renderMyPageView || function() {};
    window.renderMyPageDetailView = window.renderMyPageDetailView || function() {};
    window.renderReviewView = window.renderReviewView || function() {};
    window.renderAdminView = window.renderAdminView || function() {};

    window.openCitizenReportModal = window.openCitizenReportModal || function() {
      var modal = document.getElementById('citizenReportModal');
      if (modal) modal.style.display = 'flex';
      else if (typeof window.openCitizenReportModalImpl === 'function') window.openCitizenReportModalImpl();
    };
    window.closeCitizenReportModal = window.closeCitizenReportModal || function() {
      var modal = document.getElementById('citizenReportModal');
      if (modal) modal.style.display = 'none';
      else if (typeof window.closeCitizenReportModalImpl === 'function') window.closeCitizenReportModalImpl();
    };

    window.navigateTo = function(tabId, paramData) {
      console.log("Navigating to tab:", tabId);
      var mainEl = document.querySelector('.gas-main');
      if (mainEl && window.appState) {
        window.appState.scrollPositionMap = window.appState.scrollPositionMap || {};
        window.appState.scrollPositionMap[window.appState.currentTab] = mainEl.scrollTop;
      }
      if (window.appState) {
        window.appState.previousTab = window.appState.currentTab;
        window.appState.currentTab = tabId;
      }

      var sections = document.querySelectorAll('.tab-section');
      for (var i = 0; i < sections.length; i++) {
        sections[i].classList.remove('active');
        sections[i].style.display = 'none';
      }

      var navBtns = document.querySelectorAll('.gas-nav-item');
      for (var j = 0; j < navBtns.length; j++) {
        navBtns[j].classList.remove('active');
      }

      var targetTabEl = document.getElementById('page_' + tabId);
      if (targetTabEl) {
        targetTabEl.classList.add('active');
        targetTabEl.style.display = 'block';
      }

      var navBtn = document.getElementById('nav_' + tabId);
      if (navBtn) {
        navBtn.classList.add('active');
      }

      try {
        if (tabId === 'home' && typeof window.renderHomeView === 'function') window.renderHomeView();
        if (tabId === 'status_official' && typeof window.renderStatusOfficialView === 'function') window.renderStatusOfficialView();
        if (tabId === 'status_citizen' && typeof window.renderStatusCitizenView === 'function') window.renderStatusCitizenView();
        if (tabId === 'search' && typeof window.renderSearchView === 'function') window.renderSearchView();
        if (tabId === 'course' && typeof window.renderCourseView === 'function') window.renderCourseView();
        if (tabId === 'mypage' && typeof window.renderMyPageView === 'function') window.renderMyPageView();
        if (tabId === 'agentic_rag' && typeof window.ensureKakaoMapsLoaded === 'function') window.ensureKakaoMapsLoaded();
        if (tabId === 'admin' && typeof window.renderAdminView === 'function') window.renderAdminView();
      } catch (err) {
        console.warn('Tab view render notice:', err);
      }
    };
  </script>
