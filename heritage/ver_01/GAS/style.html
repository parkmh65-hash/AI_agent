<style>
  /* style.html - 세종시 문화유산 GAS 스마트 웹앱 공통 CSS (Pettriplife 톤앤매너) */
  :root {
    --bg-primary: #0b132b;
    --bg-secondary: #1c2541;
    --bg-card: rgba(28, 37, 65, 0.85);
    --bg-glass: rgba(255, 255, 255, 0.05);
    --border-color: rgba(255, 255, 255, 0.12);
    
    --accent-cyan: #00f5d4;
    --accent-blue: #4895ef;
    --accent-purple: #7209b7;
    --accent-amber: #f77f00;
    --accent-rose: #f72585;
    
    --text-main: #f8f9fa;
    --text-sub: #a0aec0;
    --text-muted: #718096;

    --radius-sm: 8px;
    --radius-md: 14px;
    --radius-lg: 20px;

    --shadow-glow: 0 8px 32px 0 rgba(0, 245, 212, 0.18);
    --shadow-card: 0 10px 30px rgba(0, 0, 0, 0.35);
    --font-family: 'Noto Sans KR', 'Outfit', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--font-family);
    background-color: var(--bg-primary);
    color: var(--text-main);
    line-height: 1.6;
    overflow-x: hidden;
  }

  /* App Layout Grid */
  .gas-app-container {
    display: flex;
    min-height: 100vh;
    width: 100vw;
    background: radial-gradient(circle at 10% 20%, rgba(114, 9, 183, 0.18) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(0, 245, 212, 0.12) 0%, transparent 40%),
                var(--bg-primary);
  }

  .gas-sidebar {
    width: 270px;
    background: rgba(15, 23, 42, 0.92);
    backdrop-filter: blur(16px);
    border-right: 1px solid var(--border-color);
    display: flex;
    flex-direction: column;
    padding: 24px 16px;
    shrink: 0;
    z-index: 100;
  }

  .gas-brand {
    display: flex;
    align-items: center;
    gap: 12px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--border-color);
    margin-bottom: 24px;
  }

  .gas-logo {
    width: auto;
    min-width: fit-content;
    height: auto;
    padding: 6px 12px;
    border-radius: var(--radius-sm);
    background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
    color: #0b132b;
    font-weight: 900;
    font-size: 0.95rem;
    letter-spacing: -0.3px;
    white-space: nowrap;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    box-shadow: var(--shadow-glow);
  }

  .gas-nav-menu { display: flex; flex-direction: column; gap: 8px; }
  
  .gas-nav-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 13px 16px;
    border-radius: var(--radius-md);
    color: var(--text-sub);
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    border: 1px solid transparent;
    background: transparent;
    text-align: left;
    width: 100%;
    transition: all 0.2s ease-in-out;
  }

  .gas-nav-item:hover {
    background: rgba(255, 255, 255, 0.08);
    color: #fff;
  }

  .gas-nav-item.active {
    background: linear-gradient(135deg, rgba(0, 245, 212, 0.18), rgba(72, 149, 239, 0.18));
    border-color: rgba(0, 245, 212, 0.4);
    color: var(--accent-cyan);
    font-weight: 700;
  }

  .gas-main {
    flex: 1;
    height: 100vh;
    overflow-y: auto;
    padding: 28px 36px;
  }

  /* Glassmorphic Card (Pettriplife Style) */
  .glass-card {
    background: var(--bg-card);
    backdrop-filter: blur(14px);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-lg);
    padding: 24px;
    box-shadow: var(--shadow-card);
    transition: transform 0.25s ease, box-shadow 0.25s ease;
  }

  .glass-card:hover {
    border-color: rgba(0, 245, 212, 0.3);
  }

  .page-title {
    font-size: 1.85rem;
    font-weight: 800;
    background: linear-gradient(135deg, #ffffff, var(--accent-cyan));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 6px;
  }

  .page-desc {
    color: var(--text-sub);
    font-size: 0.95rem;
    margin-bottom: 24px;
  }

  /* Buttons */
  .btn-primary {
    background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
    color: #0b132b;
    font-weight: 700;
    padding: 12px 22px;
    border-radius: var(--radius-md);
    border: none;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    transition: all 0.2s ease-in-out;
  }

  .btn-primary:hover {
    opacity: 0.92;
    transform: translateY(-2px);
    box-shadow: var(--shadow-glow);
  }

  .btn-secondary {
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid var(--border-color);
    color: #fff;
    font-weight: 600;
    padding: 10px 18px;
    border-radius: var(--radius-md);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    transition: all 0.2s ease;
  }

  .btn-secondary:hover {
    background: rgba(255, 255, 255, 0.16);
  }

  .btn-like {
    background: rgba(247, 37, 133, 0.15);
    border: 1px solid rgba(247, 37, 133, 0.4);
    color: var(--accent-rose);
    border-radius: 20px;
    padding: 6px 14px;
    font-size: 0.85rem;
    font-weight: 700;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  /* Badges */
  .badge {
    padding: 5px 12px;
    border-radius: 20px;
    font-size: 0.76rem;
    font-weight: 700;
    display: inline-block;
  }

  .badge-era {
    background: rgba(114, 9, 183, 0.28);
    color: #c77dff;
    border: 1px solid rgba(114, 9, 183, 0.5);
  }

  .badge-dong {
    background: rgba(0, 245, 212, 0.18);
    color: var(--accent-cyan);
    border: 1px solid rgba(0, 245, 212, 0.4);
  }

  .badge-citizen {
    background: rgba(247, 127, 0, 0.2);
    color: var(--accent-amber);
    border: 1px solid rgba(247, 127, 0, 0.4);
  }

  .badge-status-pending {
    background: rgba(247, 127, 0, 0.25);
    color: #ffb703;
    border: 1px solid rgba(247, 127, 0, 0.5);
  }

  .badge-status-approved {
    background: rgba(0, 245, 212, 0.25);
    color: var(--accent-cyan);
    border: 1px solid rgba(0, 245, 212, 0.5);
  }

  .badge-status-rejected {
    background: rgba(239, 68, 68, 0.25);
    color: #f87171;
    border: 1px solid rgba(239, 68, 68, 0.5);
  }

  /* Modal Overlay */
  .modal-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0, 0, 0, 0.8);
    backdrop-filter: blur(8px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 2000;
  }

  .modal-content {
    background: #151e36;
    border: 1px solid var(--border-color);
    border-radius: var(--radius-lg);
    width: 92%;
    max-width: 680px;
    max-height: 88vh;
    overflow-y: auto;
    padding: 32px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
  }

  .tab-section { display: none !important; }
  .tab-section.active { display: block !important; }

  /* Toast Notification */
  #toastContainer {
    position: fixed;
    bottom: 24px;
    right: 24px;
    z-index: 3000;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .toast {
    background: #151e36;
    border: 1px solid var(--accent-cyan);
    color: #fff;
    padding: 14px 20px;
    border-radius: var(--radius-md);
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    font-size: 0.92rem;
    font-weight: 600;
    animation: fadeIn 0.3s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Printable Magazine Styles */
  @media print {
    body { background: #fff !important; color: #000 !important; }
    .gas-sidebar, .btn-primary, .btn-secondary { display: none !important; }
    .gas-main { padding: 0 !important; }
    .glass-card { background: #fff !important; color: #000 !important; border: 1px solid #ccc !important; box-shadow: none !important; }
  }
</style>
