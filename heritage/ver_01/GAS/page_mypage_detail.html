<!-- page_mypage_detail.html - 8. 나만의 문화유산 (상세보기 / AI 여행잡지) -->
<section id="page_mypage_detail" class="tab-section">
  <div style="margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center;">
    <button class="btn-secondary" onclick="navigateTo('mypage')">
      ⬅️ 보관함으로 돌아가기
    </button>
    <div style="display: flex; gap: 10px;">
      <button class="btn-primary" onclick="generateGeminiAIMagazine()">
        ✨ Gemini AI 여행잡지 집필하기
      </button>
      <button class="btn-secondary" onclick="window.print()">
        🖨️ 잡지 인쇄/PDF 저장
      </button>
    </div>
  </div>

  <div class="glass-card" style="margin-bottom: 24px;">
    <!-- Course Info Banner -->
    <div style="border-bottom: 1px solid var(--border-color); padding-bottom: 16px; margin-bottom: 20px;">
      <span class="badge badge-dong" style="margin-bottom: 8px;">세종 문화유산 코스 상세</span>
      <h1 id="myDetailCourseTitle" style="font-size: 1.8rem; font-weight: 800; color: #fff;">코스 상세보기</h1>
      <p id="myDetailCoursePath" style="font-size: 0.95rem; color: var(--accent-cyan); margin-top: 6px;">📍 경로: </p>
      <div style="display: flex; gap: 16px; font-size: 0.85rem; color: var(--text-sub); margin-top: 8px;">
        <span id="myDetailCourseTransport">🚌 추천 교통수단: 승용차</span>
        <span id="myDetailCourseDuration">⏱️ 예상 소요시간: 60분</span>
      </div>
    </div>

    <!-- Gemini AI Magazine Content Container -->
    <div id="aiMagazineContainer" style="background: rgba(11,19,43,0.8); border: 1px solid rgba(0,245,212,0.25); border-radius: var(--radius-md); padding: 24px; min-height: 240px;">
      <div id="aiMagazinePlaceholder" style="text-align: center; padding: 40px 20px; color: var(--text-sub);">
        <p style="font-size: 1.05rem; font-weight: 600; margin-bottom: 10px;">✨ 상단의 [Gemini AI 여행잡지 집필하기] 버튼을 클릭해보세요!</p>
        <p style="font-size: 0.85rem;">Gemini AI가 코스의 문화유산 화보, 역사적 유래, 생태적 쉼터 정보를 종합하여 고급 여행 잡지 아티클을 자동 집필합니다.</p>
      </div>

      <div id="aiMagazineArticleContent" style="display: none; line-height: 1.8; color: #e2e8f0;">
        <!-- Dynamically filled via Gemini AI -->
      </div>
    </div>

    <!-- Email Send Section -->
    <div style="border-top: 1px solid var(--border-color); padding-top: 20px; margin-top: 24px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 14px;">
      <div>
        <h4 style="font-size: 0.95rem; font-weight: 700; color: #fff;">📧 이메일로 여행잡지 발송받기</h4>
        <p style="font-size: 0.82rem; color: var(--text-sub);">작성된 AI 여행잡지 콘텐츠를 이메일로 신속히 전송합니다. (MailApp 서비스)</p>
      </div>

      <div style="display: flex; gap: 8px;">
        <input type="email" id="targetEmailInput" placeholder="받으실 이메일 주소 입력" value="user@sejong.go.kr" style="padding: 10px 14px; border-radius: var(--radius-md); background: rgba(0,0,0,0.3); border: 1px solid var(--border-color); color: #fff; width: 240px; font-size: 0.88rem;" />
        <button class="btn-primary" onclick="sendMagazineEmail()" style="font-size: 0.88rem; padding: 10px 18px;">
          🚀 이메일 전송
        </button>
      </div>
    </div>
  </div>
</section>

<script>
  var currentDetailCourseObj = null;

  function renderMyPageDetailView(course) {
    if (!course) return;
    currentDetailCourseObj = course;

    document.getElementById('myDetailCourseTitle').innerText = course.course_name || '문화유산 코스';
    var pathStr = (course.items || []).map(function(it) { return it.name; }).join(' ➔ ');
    document.getElementById('myDetailCoursePath').innerText = "📍 코스 경로: " + pathStr;
    document.getElementById('myDetailCourseTransport').innerText = "🚌 추천 교통수단: " + (course.transport || '승용차');
    document.getElementById('myDetailCourseDuration').innerText = "⏱️ 예상 소요시간: 약 " + (course.total_time_min || 60) + "분";

    document.getElementById('aiMagazinePlaceholder').style.display = 'block';
    document.getElementById('aiMagazineArticleContent').style.display = 'none';
  }

  function generateGeminiAIMagazine() {
    if (!currentDetailCourseObj) return;

    var placeholder = document.getElementById('aiMagazinePlaceholder');
    var articleContent = document.getElementById('aiMagazineArticleContent');

    placeholder.innerHTML = '<div style="font-weight: 700; color: var(--accent-cyan);">🤖 Gemini AI가 세종시 문화유산 여행잡지를 집필 중입니다... 잠시만 기다려주세요!</div>';
    placeholder.style.display = 'block';
    articleContent.style.display = 'none';

    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(function(htmlRes) {
          placeholder.style.display = 'none';
          articleContent.innerHTML = htmlRes;
          articleContent.style.display = 'block';
          showToast("✨ Gemini AI 여행잡지가 집필되었습니다!");
        })
        .withFailureHandler(function() {
          renderFallbackMagazine();
        })
        .generateAIMagazineGAS(currentDetailCourseObj);
    } else {
      setTimeout(function() {
        renderFallbackMagazine();
      }, 1200);
    }
  }

  function renderFallbackMagazine() {
    var placeholder = document.getElementById('aiMagazinePlaceholder');
    var articleContent = document.getElementById('aiMagazineArticleContent');
    placeholder.style.display = 'none';

    var c = currentDetailCourseObj;
    var itemsStr = (c.items || []).map(function(it) { return it.name; }).join(' 및 ');

    var html = '<div style="font-family: var(--font-family);">' +
        '<h2 style="font-size: 1.5rem; font-weight: 900; color: var(--accent-cyan); margin-bottom: 12px;">' +
          '[SPECIAL MAGAZINE] 세종의 과거와 미래를 거닐다: ' + (c.course_name || '추천 코스') +
        '</h2>' +
        '<p style="font-size: 0.95rem; color: var(--text-sub); margin-bottom: 18px;">' +
          '세종특별자치시의 웅장한 역사 유산인 <strong>' + itemsStr + '</strong>(을)를 포함한 추천 코스 탐방 리포트입니다.' +
        '</p>' +
        '<div style="background: rgba(255,255,255,0.05); padding: 18px; border-radius: 12px; margin-bottom: 16px;">' +
          '<h4 style="color: var(--accent-amber); font-weight: 700; margin-bottom: 6px;">🏛️ 1관. 관아와 산사의 고풍스러운 숨결</h4>' +
          '<p style="font-size: 0.9rem; line-height: 1.6;">' +
            '조선시대 연기현 관아의 당당한 풍채를 자랑하는 연기아문과 웅장한 비암사 극락보전 단청은 보는 이로 하여금 수백 년 전 역사의 한 장면에 서 있는 듯한 전율을 선사합니다.' +
          '</p>' +
        '</div>' +
        '<div style="background: rgba(255,255,255,0.05); padding: 18px; border-radius: 12px; margin-bottom: 16px;">' +
          '<h4 style="color: var(--accent-cyan); font-weight: 700; margin-bottom: 6px;">🌿 2관. 한옥 공원의 정서적 쉼터</h4>' +
          '<p style="font-size: 0.9rem; line-height: 1.6;">' +
            '현대식 신도시 빌딩 사이에 굳건히 조화를 이루는 초려 이유태 역사공원의 고즈넉한 한옥 툇마루에서 세종의 자연 경관을 조망하며 차 한잔의 안식을 다져봅니다.' +
          '</p>' +
        '</div>' +
      '</div>';

    articleContent.innerHTML = html;
    articleContent.style.display = 'block';
    showToast("✨ AI 여행잡지 집필이 완료되었습니다!");
  }

  function sendMagazineEmail() {
    var email = document.getElementById('targetEmailInput').value.trim();
    if (!email) { alert('발송할 이메일 주소를 입력해 주세요.'); return; }

    showToast("📧 이메일 발송 요청 중...");

    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run.withSuccessHandler(function() {
        showToast("🚀 여행잡지가 이메일(" + email + ")로 성공적으로 발송되었습니다!");
      }).sendMagazineEmailGAS(email, currentDetailCourseObj);
    } else {
      setTimeout(function() {
        showToast("🚀 여행잡지가 이메일(" + email + ")로 성공적으로 발송되었습니다!");
      }, 1000);
    }
  }
</script>
