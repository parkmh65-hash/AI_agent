<!-- page_status_official.html - 2. 문화유산 현황 (국가/지자체 등록문화유산) -->
<section id="page_status_official" class="tab-section">
  <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 24px; flex-wrap: wrap; gap: 14px;">
    <div>
      <h1 class="page-title">국가/지자체 등록 문화유산 현황</h1>
      <p class="page-desc">
        세종시에 지정 등록된 문화유산 현황을 시대별, 읍면동별로 확인하며, 상세 검색이 가능합니다.
      </p>
    </div>
    
    <div style="display: flex; gap: 10px; align-items: center;">
      <span style="font-size: 0.9rem; color: var(--text-sub);">
        총 등록 유산: <strong style="color: var(--accent-cyan);" class="count-official-text">0</strong>건
      </span>
      <button id="toggleOfficialGraphBtn" class="btn-secondary" onclick="toggleOfficialChartSection()">
        📊 분포 그래프 보기/접기
      </button>
    </div>
  </div>

  <!-- Google Charts / Distribution Chart Section -->
  <div id="officialChartSection" class="glass-card" style="margin-bottom: 28px; display: none;">
    <h3 style="font-size: 1.1rem; font-weight: 700; color: var(--accent-cyan); margin-bottom: 16px;">
      📈 시대별 & 읍면동별 분포 현황
    </h3>
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px;">
      <div>
        <h4 style="font-size: 0.9rem; color: var(--text-sub); margin-bottom: 10px;">[시대별 지정 건수]</h4>
        <div id="eraChartCanvas" style="height: 180px; width: 100%;"></div>
      </div>
      <div>
        <h4 style="font-size: 0.9rem; color: var(--text-sub); margin-bottom: 10px;">[읍·면·동별 지정 건수]</h4>
        <div id="dongChartCanvas" style="height: 180px; width: 100%;"></div>
      </div>
    </div>
  </div>

  <!-- Scrollable List View (20 건 단위 페이지네이션 / 무한스크롤) -->
  <div id="officialHeritageGrid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px;">
    <!-- Rendered via renderStatusOfficialView() -->
  </div>
</section>

<script>
  var appState = window.appState = window.appState || { officialHeritages: [], citizenHeritages: [], likesMap: {}, courseList: [], savedCourses: [] };

  function renderStatusOfficialView() {
    var grid = document.getElementById('officialHeritageGrid');
    if (!grid) return;
    var list = appState.officialHeritages || [];
    if (!list || list.length === 0) {
      grid.innerHTML = '<div class="glass-card" style="grid-column: 1/-1; text-align: center; color: var(--text-sub);">Supabase DB에서 공식 문화유산 데이터를 로딩 중입니다...</div>';
      return;
    }

    grid.innerHTML = list.map(function(h) {
      var eraText = h.era_normalized || h.era || '조선시대';
      var dongText = h.dong_eup_myeon || h.dong || '세종시';
      var imgUrl = h.image_url || 'https://images.unsplash.com/photo-1548625149-fc4a29cf7092?w=800';
      var likes = (h.like_count || 100) + (appState.likesMap[h.id] || 0);

      return '<div class="glass-card" style="cursor: pointer;" onclick="openSearchDetailById(\'' + h.id + '\')">' +
          '<img src="' + imgUrl + '" style="width: 100%; height: 160px; object-fit: cover; border-radius: var(--radius-md); margin-bottom: 12px;" />' +
          '<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">' +
            '<div>' +
              '<span class="badge badge-era">' + eraText + '</span> ' +
              '<span class="badge badge-dong">' + dongText + '</span>' +
            '</div>' +
            '<button class="btn-like" onclick="toggleLike(\'' + h.id + '\', event)">' +
              '❤️ <span class="like-count-' + h.id + '" data-base-likes="' + (h.like_count || 100) + '">' + likes + '</span>' +
            '</button>' +
          '</div>' +
          '<h3 style="font-size: 1.15rem; font-weight: 700; color: #fff; margin-bottom: 6px;">' + h.name + '</h3>' +
          '<p style="font-size: 0.82rem; color: var(--text-sub); line-height: 1.5; height: 38px; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;">' +
            (h.description || '') +
          '</p>' +
        '</div>';
    }).join('');
  }

  function toggleOfficialChartSection() {
    var sec = document.getElementById('officialChartSection');
    if (sec.style.display === 'none') {
      sec.style.display = 'block';
      drawOfficialCharts();
    } else {
      sec.style.display = 'none';
    }
  }

  function drawOfficialCharts() {
    var eraCounts = {}, dongCounts = {};
    appState.officialHeritages.forEach(function(h) {
      eraCounts[h.era_normalized] = (eraCounts[h.era_normalized] || 0) + 1;
      dongCounts[h.dong_eup_myeon] = (dongCounts[h.dong_eup_myeon] || 0) + 1;
    });

    var eraContainer = document.getElementById('eraChartCanvas');
    var dongContainer = document.getElementById('dongChartCanvas');

    eraContainer.innerHTML = Object.keys(eraCounts).map(function(k) {
      return '<div style="display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid var(--border-color); font-size:0.88rem;"><span>' + k + '</span><strong style="color:var(--accent-cyan);">' + eraCounts[k] + '건</strong></div>';
    }).join('');

    dongContainer.innerHTML = Object.keys(dongCounts).map(function(k) {
      return '<div style="display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid var(--border-color); font-size:0.88rem;"><span>' + k + '</span><strong style="color:var(--accent-blue);">' + dongCounts[k] + '건</strong></div>';
    }).join('');
  }
</script>
