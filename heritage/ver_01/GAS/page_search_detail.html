<!-- page_search_detail.html - 5. 문화유산 검색 상세정보 -->
<section id="page_search_detail" class="tab-section">
  <div style="margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center;">
    <button class="btn-secondary" onclick="goBack()">
      ⬅️ 뒤로가기
    </button>
    <div style="display: flex; gap: 8px;" id="detailActionGroup">
      <!-- Dynamic course add and like -->
    </div>
  </div>

  <div class="glass-card" style="margin-bottom: 28px;">
    <!-- Title Header -->
    <div style="display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 12px; margin-bottom: 16px;">
      <div>
        <div style="display: flex; gap: 8px; margin-bottom: 8px;" id="detailBadges">
          <span class="badge badge-era">조선시대</span>
          <span class="badge badge-dong">연기면</span>
        </div>
        <h1 id="detailName" style="font-size: 2rem; font-weight: 800; color: #fff;">문화유산 명칭</h1>
        <p id="detailAddress" style="color: var(--accent-cyan); font-size: 0.95rem; margin-top: 4px;">📍 세종특별자치시 소재지 주소</p>
      </div>

      <div style="display: flex; align-items: center; gap: 10px;">
        <button id="detailLikeBtn" class="btn-like" style="padding: 10px 20px; font-size: 1rem;">
          ❤️ <span id="detailLikeCount">0</span>
        </button>
      </div>
    </div>

    <!-- Photo Gallery (Multiple Photos, +더보기 Expansion) -->
    <div style="margin-bottom: 24px;">
      <h4 style="font-size: 0.95rem; color: var(--text-sub); margin-bottom: 10px;">🖼️ 문화유산 화보 갤러리</h4>
      <div style="display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 12px; height: 260px;" id="detailGalleryGrid">
        <img id="detailMainImg" src="" style="width: 100%; height: 100%; object-fit: cover; border-radius: var(--radius-md);" />
        <img id="detailSubImg1" src="https://images.unsplash.com/photo-1590523741831-ab7e8b8f9c7f?w=600&q=80" style="width: 100%; height: 100%; object-fit: cover; border-radius: var(--radius-md);" />
        <div style="position: relative; height: 100%; width: 100%;">
          <img id="detailSubImg2" src="https://images.unsplash.com/photo-1578632767115-351597cf2477?w=600&q=80" style="width: 100%; height: 100%; object-fit: cover; border-radius: var(--radius-md);" />
          <div style="position: absolute; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.5); border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; cursor: pointer;" onclick="showToast('🖼️ 갤러리 확장보기 준비 중')">
            + 더보기 (3장)
          </div>
        </div>
      </div>
    </div>

    <!-- Description & Educational Think Point -->
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 24px; margin-bottom: 24px;">
      <div style="background: rgba(0,0,0,0.3); padding: 20px; border-radius: var(--radius-md); border: 1px solid var(--border-color);">
        <h3 style="font-size: 1.1rem; font-weight: 700; color: var(--accent-cyan); margin-bottom: 10px;">📜 상세 설명 및 유래</h3>
        <p id="detailDesc" style="color: var(--text-main); font-size: 0.95rem; line-height: 1.7; white-space: pre-wrap;"></p>
      </div>

      <div style="background: rgba(114,9,183,0.15); padding: 20px; border-radius: var(--radius-md); border: 1px solid rgba(114,9,183,0.4);">
        <h3 style="font-size: 1.1rem; font-weight: 700; color: #c77dff; margin-bottom: 10px;">💡 생각할 거리 (교육적 질문)</h3>
        <p id="detailThinkPoint" style="color: #e2e8f0; font-size: 0.95rem; line-height: 1.7;"></p>
      </div>
    </div>

    <!-- Citizen Reviews Summary -->
    <div style="background: rgba(0,245,212,0.05); padding: 20px; border-radius: var(--radius-md); border: 1px solid rgba(0,245,212,0.2); margin-bottom: 24px;">
      <h3 style="font-size: 1.05rem; font-weight: 700; color: var(--accent-cyan); margin-bottom: 10px;">💬 시민 탐방 후기 요약</h3>
      <p style="font-size: 0.9rem; color: var(--text-main);">
        "고즈넉한 풍경과 관아의 기품이 어우러져 세종시의 깊은 역사를 직관적으로 배울 수 있었습니다. 화장실과 주차 시설이 편리합니다." (만족도 ⭐⭐⭐⭐⭐)
      </p>
    </div>

    <!-- Map Integration Buttons (Naver / Google Maps Deep Link) & Course Planner Button -->
    <div style="display: flex; gap: 12px; flex-wrap: wrap; justify-content: flex-end; border-top: 1px solid var(--border-color); padding-top: 18px;">
      <button class="btn-secondary" id="btnNaverMapLink" style="font-size: 0.88rem;">📍 네이버지도 위치 확인</button>
      <button class="btn-secondary" id="btnGoogleMapLink" style="font-size: 0.88rem;">🗺️ 구글지도 딥링크 열기</button>
      <button class="btn-primary" id="btnAddToCoursePlanner" style="font-size: 0.95rem;">🧭 코스 만들기에 추가</button>
    </div>
  </div>
</section>

<script>
  var appState = window.appState = window.appState || { officialHeritages: [], citizenHeritages: [], likesMap: {}, courseList: [], savedCourses: [] };

  function renderSearchDetailView(item) {
    if (!item) return;

    document.getElementById('detailName').innerText = item.name || '문화유산';
    document.getElementById('detailAddress').innerText = "📍 " + (item.address || '세종특별자치시 소재지');
    document.getElementById('detailDesc').innerText = item.description || item.reason || '설명 정보가 마련되어 있습니다.';
    document.getElementById('detailThinkPoint').innerText = item.think_point || '세종시의 옛 숨결과 현대 도시 발전에 대한 역사적 교훈을 생각해봅시다.';

    var likes = (item.like_count || 100) + (appState.likesMap[item.id] || 0);
    document.getElementById('detailLikeCount').innerText = likes;

    var likeBtn = document.getElementById('detailLikeBtn');
    likeBtn.onclick = function(e) { toggleLike(item.id, e); };

    var mainImg = document.getElementById('detailMainImg');
    if (mainImg) mainImg.src = item.image_url || 'https://images.unsplash.com/photo-1548013146-72479768bada?w=600&q=80';

    var badges = document.getElementById('detailBadges');
    if (badges) {
      if (item.status === '승인' || item.status === '대기') {
        badges.innerHTML = '<span class="badge badge-citizen">시민 제보 유산</span>';
      } else {
        badges.innerHTML = '<span class="badge badge-era">' + (item.era_normalized || item.era || '조선시대') + '</span> <span class="badge badge-dong">' + (item.dong_eup_myeon || '세종시') + '</span>';
      }
    }

    // Map Deep Links
    var lat = item.lat || 36.4800;
    var lng = item.lng || 127.2800;
    var naverBtn = document.getElementById('btnNaverMapLink');
    var googleBtn = document.getElementById('btnGoogleMapLink');

    if (naverBtn) {
      naverBtn.onclick = function() {
        window.open('https://map.naver.com/v5/search/' + encodeURIComponent(item.name || '세종 문화유산'), '_blank');
      };
    }
    if (googleBtn) {
      googleBtn.onclick = function() {
        window.open('https://www.google.com/maps?q=' + lat + ',' + lng, '_blank');
      };
    }

    var addCourseBtn = document.getElementById('btnAddToCoursePlanner');
    if (addCourseBtn) {
      addCourseBtn.onclick = function() {
        navigateTo('course', { addItem: item });
      };
    }
  }
</script>
