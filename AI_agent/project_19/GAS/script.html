<script type="text/babel">
  const { useState, useEffect } = React;

  // Safe localStorage helper to prevent SecurityError inside GAS iframe sandbox
  const safeLocalStorage = {
    getItem: (key) => {
      try {
        return localStorage.getItem(key);
      } catch (e) {
        console.warn("localStorage read blocked:", e);
        return null;
      }
    },
    setItem: (key, value) => {
      try {
        localStorage.setItem(key, value);
      } catch (e) {
        console.warn("localStorage write blocked:", e);
      }
    }
  };

  function App() {
    // API URL configuration (Default: http://localhost:8080)
    const [apiBaseUrl, setApiBaseUrl] = useState(
      safeLocalStorage.getItem("agentic_rag_api_url") || "https://project-19-service-538192513096.us-central1.run.app"
    );
    const [showSettings, setShowSettings] = useState(false);
    
    // UI Input State
    const [query, setQuery] = useState("");
    const [selectedModel, setSelectedModel] = useState("openai"); // Default to OpenAI as its key is verified
    const [useAnalysis, setUseAnalysis] = useState(true);
    const [useRisks, setUseRisks] = useState(true);
    const [useOpinion, setUseOpinion] = useState(true);
    
    // Agent execution state
    const [threadId, setThreadId] = useState(null);
    const [status, setStatus] = useState(null); // 'pending_approval' or 'completed'
    const [recipeDraft, setRecipeDraft] = useState(null); // { analysis?, risks?, opinion? }
    const [recipeFinal, setRecipeFinal] = useState(null); // { analysis?, risks?, opinion? }
    const [messages, setMessages] = useState([]);
    const [feedback, setFeedback] = useState("");
    const [mermaidCode, setMermaidCode] = useState("");
    
    // Loading & error state
    const [isLoading, setIsLoading] = useState(false);
    const [isActionLoading, setIsActionLoading] = useState(false);
    const [isSeeding, setIsSeeding] = useState(false);
    const [seedResult, setSeedResult] = useState("");
    const [errorMsg, setErrorMsg] = useState("");
    const [activeTab, setActiveTab] = useState("content"); // 'content', 'workflow'

    // Save API URL helper
    const handleApiUrlChange = (e) => {
      const url = e.target.value.trim().replace(/\/$/, "");
      setApiBaseUrl(url);
      safeLocalStorage.setItem("agentic_rag_api_url", url);
    };

    // Render Mermaid Graph
    useEffect(() => {
      const renderGraph = async () => {
        const container = document.getElementById("mermaid-graph-container");
        if (!container || !mermaidCode) return;
        try {
          container.innerHTML = '<div class="spinner" style="width:20px;height:20px;border-width:2px"></div>';
          const cleanCode = mermaidCode.trim();
          const id = "mermaid-svg-" + Math.floor(Math.random() * 1000000);
          const { svg } = await mermaid.render(id, cleanCode);
          container.innerHTML = svg;
        } catch (err) {
          console.error("Mermaid render error:", err);
          container.innerHTML = `
            <div style="color:var(--danger);font-size:0.8rem;text-align:center;padding:10px">
              <i class="fa-solid fa-triangle-exclamation"></i> 에이전트 그래프 렌더링 실패
            </div>
          `;
        }
      };
      renderGraph();
    }, [mermaidCode, activeTab]);

    // DB Seed Handler
    const handleDbSeed = async () => {
      setIsSeeding(true);
      setSeedResult("");
      setErrorMsg("");
      try {
        const response = await fetch(`${apiBaseUrl}/db/seed`, {
          method: "POST"
        });
        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.detail || "데이터 구축 실패");
        }
        setSeedResult(`✅ 성공: ${data.message}`);
      } catch (err) {
        console.error(err);
        setErrorMsg(`⚠️ DB Seed 실패: ${err.message}`);
      } finally {
        setIsSeeding(false);
      }
    };

    // Agentic RAG start handler
    const handleStartRequest = async () => {
      if (!query.trim()) {
        alert("질문을 입력해 주세요.");
        return;
      }
      if (!useAnalysis && !useRisks && !useOpinion) {
        alert("보고서 항목(시장 분석, 리스크 평가, 종합 의견) 중 하나 이상을 선택해 주세요.");
        return;
      }

      const activeSections = [];
      if (useAnalysis) activeSections.push("analysis");
      if (useRisks) activeSections.push("risks");
      if (useOpinion) activeSections.push("opinion");

      setIsLoading(true);
      setErrorMsg("");
      setRecipeDraft(null);
      setRecipeFinal(null);
      setMessages([]);
      setThreadId(null);
      setStatus(null);
      setMermaidCode("");
      setActiveTab("content");

      try {
        const response = await fetch(`${apiBaseUrl}/agent/start`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            query: query.trim(),
            sections: activeSections,
            model: selectedModel
          })
        });

        if (!response.ok) {
          const err = await response.json();
          throw new Error(err.detail || "에이전트 실행 실패");
        }

        const data = await response.json();
        setThreadId(data.thread_id);
        setStatus(data.status);
        setRecipeDraft(data.recipe_draft || {});
        setRecipeFinal(data.recipe_final || {});
        setMessages(data.messages || []);
        setMermaidCode(data.mermaid || "");
      } catch (err) {
        console.error(err);
        setErrorMsg(`⚠️ 에이전트 실행 오류: ${err.message}`);
      } finally {
        setIsLoading(false);
      }
    };

    // Human-in-the-loop submit handler
    const handleApproveAction = async (isApproved) => {
      if (!isApproved && !feedback.trim()) {
        alert("수정 피드백 내용을 입력해 주세요.");
        return;
      }

      setIsActionLoading(true);
      setErrorMsg("");

      try {
        const response = await fetch(`${apiBaseUrl}/agent/approve`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            thread_id: threadId,
            approved: isApproved,
            feedback: isApproved ? "" : feedback.trim()
          })
        });

        if (!response.ok) {
          const err = await response.json();
          throw new Error(err.detail || "승인/피드백 제출 실패");
        }

        const data = await response.json();
        setStatus(data.status);
        setRecipeDraft(data.recipe_draft || {});
        setRecipeFinal(data.recipe_final || {});
        setMessages(data.messages || []);
        setMermaidCode(data.mermaid || "");
        if (!isApproved) {
          setFeedback(""); // Reset feedback input on revision request
        }
      } catch (err) {
        console.error(err);
        setErrorMsg(`⚠️ 피드백 반영 오류: ${err.message}`);
      } finally {
        setIsActionLoading(false);
      }
    };

    // Reset UI to initial state
    const handleReset = () => {
      setQuery("");
      setRecipeDraft(null);
      setRecipeFinal(null);
      setMessages([]);
      setThreadId(null);
      setStatus(null);
      setMermaidCode("");
      setErrorMsg("");
      setFeedback("");
    };

    return (
      <div className="app-container">
        {/* Header Section */}
        <header>
          <div className="header-logo">
            <i className="fa-solid fa-magnifying-glass-chart"></i>
            <div>
              <h1>Agentic RAG 정보검색 시스템</h1>
              <div className="subtitle">LangGraph StateGraph, Supabase Vector DB, Query Rewriter & Human-in-the-Loop</div>
            </div>
          </div>
          <div className="header-actions">
            <button 
              className="btn btn-secondary" 
              onClick={() => setShowSettings(!showSettings)}
            >
              <i className="fa-solid fa-gear"></i> 백엔드 설정
            </button>
          </div>
        </header>

        {/* Configuration settings panel */}
        {showSettings && (
          <div className="card settings-card">
            <div className="card-title" style={{ fontSize: '0.95rem', borderBottom: 'none', paddingBottom: 0 }}>
              <i className="fa-solid fa-network-wired"></i> API 주소 및 백엔드 설정
            </div>
            <div style={{ display: 'flex', flexDirection: 'column', gap: '12px' }}>
              <div style={{ display: 'flex', gap: '12px' }}>
                <input 
                  type="text" 
                  className="input-field" 
                  value={apiBaseUrl}
                  onChange={handleApiUrlChange}
                  placeholder="예: http://localhost:8080"
                />
              </div>
              <div className="db-seed-bar">
                <div>
                  <strong>금융 데이터 수집 및 구축 (DB Ingest):</strong>
                  <div style={{ fontSize: '0.75rem', color: 'var(--text-secondary)', marginTop: '2px' }}>
                    네이버, 야후, 다음 금융 페이지를 크롤링하여 Supabase pgvector 데이터베이스에 임베딩을 저장합니다.
                  </div>
                </div>
                <button 
                  className="btn btn-primary btn-sm"
                  onClick={handleDbSeed}
                  disabled={isSeeding}
                  style={{ minWidth: '120px' }}
                >
                  {isSeeding ? (
                    <>
                      <i className="fa-solid fa-circle-notch fa-spin"></i> 구축 중
                    </>
                  ) : (
                    <>
                      <i className="fa-solid fa-database"></i> 데이터 구축
                    </>
                  )}
                </button>
              </div>
              {seedResult && <div style={{ color: 'var(--success)', fontSize: '0.8rem' }}>{seedResult}</div>}
            </div>
          </div>
        )}

        {/* Main Grid layout */}
        <div className="main-grid">
          {/* Left Column: Controls & Input */}
          <div className="card">
            <div className="card-title">
              <i className="fa-solid fa-sliders"></i> 설정 및 질의하기
            </div>

            {/* 수행 모델 선택하기 */}
            <div className="input-group">
              <label className="input-label">수행 모델 선택하기</label>
              <select 
                className="input-field"
                value={selectedModel}
                onChange={(e) => setSelectedModel(e.target.value)}
                disabled={isLoading || threadId}
              >
                <option value="openai">OpenAI GPT-4o-mini (권장)</option>
                <option value="gemini">Google Gemini 1.5 Flash</option>
              </select>
            </div>

            {/* 작성을 원하는 항목 선택하기 */}
            <div className="input-group">
              <label className="input-label">작성을 원하는 항목 선택하기</label>
              
              {/* Market Analysis */}
              <div className="switch-container">
                <div className="switch-label">
                  <i className="fa-solid fa-chart-line"></i>
                  <span>시장 분석 및 동향</span>
                </div>
                <label className="switch">
                  <input 
                    type="checkbox" 
                    checked={useAnalysis} 
                    onChange={(e) => setUseAnalysis(e.target.checked)}
                    disabled={isLoading || threadId}
                  />
                  <span className="slider"></span>
                </label>
              </div>

              {/* Risks */}
              <div className="switch-container">
                <div className="switch-label">
                  <i className="fa-solid fa-triangle-exclamation"></i>
                  <span>리스크 및 주요 요인</span>
                </div>
                <label className="switch">
                  <input 
                    type="checkbox" 
                    checked={useRisks} 
                    onChange={(e) => setUseRisks(e.target.checked)}
                    disabled={isLoading || threadId}
                  />
                  <span className="slider"></span>
                </label>
              </div>

              {/* Opinion */}
              <div className="switch-container">
                <div className="switch-label">
                  <i className="fa-solid fa-comments"></i>
                  <span>종합 투자의견</span>
                </div>
                <label className="switch">
                  <input 
                    type="checkbox" 
                    checked={useOpinion} 
                    onChange={(e) => setUseOpinion(e.target.checked)}
                    disabled={isLoading || threadId}
                  />
                  <span className="slider"></span>
                </label>
              </div>
            </div>

            {/* 질문 입력하기 */}
            <div className="input-group">
              <label className="input-label">질의하기</label>
              <textarea 
                className="input-field textarea-field"
                value={query}
                onChange={(e) => setQuery(e.target.value)}
                placeholder="예: 삼성전자 반도체 부문 실적 호조 및 위험 요인은 어떤 것들이 있나요? (질문이 부실하면 자동으로 재작성됩니다)"
                disabled={isLoading || threadId}
              />
            </div>

            {/* Action buttons */}
            {!threadId ? (
              <button 
                className="btn btn-primary"
                onClick={handleStartRequest}
                disabled={isLoading}
                style={{ width: '100%', padding: '12px' }}
              >
                {isLoading ? (
                  <>
                    <i className="fa-solid fa-circle-notch fa-spin"></i> 요청 처리 중...
                  </>
                ) : (
                  <>
                    <i className="fa-solid fa-paper-plane"></i> 요청 보내기
                  </>
                )}
              </button>
            ) : (
              <button 
                className="btn btn-secondary"
                onClick={handleReset}
                style={{ width: '100%', padding: '12px' }}
              >
                <i className="fa-solid fa-arrow-rotate-left"></i> 새로 질문하기
              </button>
            )}

            {errorMsg && (
              <div style={{ color: 'var(--danger)', fontSize: '0.85rem', whiteSpace: 'pre-wrap', marginTop: '10px' }}>
                {errorMsg}
              </div>
            )}
          </div>

          {/* Right Column: Execution Output */}
          <div className="card">
            <div className="card-title" style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: '10px' }}>
                <i className="fa-solid fa-square-poll-vertical"></i>
                <span>응답 결과</span>
              </div>
              
              {status && (
                <span className={`status-badge ${status}`}>
                  {status === 'pending_approval' ? (
                    <>
                      <i className="fa-solid fa-user-clock"></i> 승인 대기중
                    </>
                  ) : (
                    <>
                      <i className="fa-solid fa-circle-check"></i> 작성 완료
                    </>
                  )}
                </span>
              )}
            </div>

            {isLoading && (
              <div className="placeholder-text">
                <div className="spinner"></div>
                <div style={{ color: 'var(--accent)', fontWeight: '600', fontSize: '1.1rem' }}>AI 질문중입니다</div>
                <p style={{ fontSize: '0.85rem' }}>에이전트가 정보를 수집하고 관련성을 검토하고 있습니다.</p>
              </div>
            )}

            {!isLoading && !threadId && (
              <div className="placeholder-text">
                <i className="fa-solid fa-comments-dollar"></i>
                <div>질문을 작성하고 요청을 보내주세요.</div>
                <p style={{ fontSize: '0.8rem' }}>RAG 기반 분석 보고서를 항목별로 자동 작성합니다.</p>
              </div>
            )}

            {!isLoading && threadId && (
              <div className="response-container">
                {/* Chat Log history */}
                <div className="input-group">
                  <span className="input-label"><i className="fa-solid fa-receipt"></i> 에이전트 실행 내역 (Messages)</span>
                  <div className="chat-box">
                    {messages.map((m, idx) => (
                      <div key={idx} className={`chat-message ${m.role}`}>
                        <strong>{m.role === 'user' ? '질문' : '에이전트'}:</strong> {m.content}
                      </div>
                    ))}
                  </div>
                </div>

                {/* Tab layout headers */}
                <div className="tab-headers">
                  <button 
                    className={`tab-btn ${activeTab === 'content' ? 'active' : ''}`}
                    onClick={() => setActiveTab("content")}
                  >
                    <i className="fa-solid fa-file-invoice"></i> 리포트 본문
                  </button>
                  <button 
                    className={`tab-btn ${activeTab === 'workflow' ? 'active' : ''}`}
                    onClick={() => setActiveTab("workflow")}
                  >
                    <i className="fa-solid fa-diagram-project"></i> 워크플로 그래프
                  </button>
                </div>

                {/* Content display */}
                {activeTab === 'content' && (
                  <div>
                    {/* Render Final report if completed */}
                    {status === 'completed' && recipeFinal && (
                      <div>
                        {Object.entries(recipeFinal).map(([sec, content]) => (
                          <div key={sec} className="report-section" style={{ borderLeft: '4px solid var(--success)' }}>
                            <div className="report-section-title">
                              {sec === 'analysis' && <><i className="fa-solid fa-chart-line"></i> 시장 분석 및 동향</>}
                              {sec === 'risks' && <><i className="fa-solid fa-triangle-exclamation"></i> 리스크 및 주요 요인</>}
                              {sec === 'opinion' && <><i className="fa-solid fa-comments"></i> 종합 투자의견</>}
                            </div>
                            <div className="report-section-content" dangerouslySetInnerHTML={{ __html: content }} />
                          </div>
                        ))}
                      </div>
                    )}

                    {/* Render Draft report if pending approval */}
                    {status === 'pending_approval' && recipeDraft && (
                      <div style={{ display: 'flex', flexContainer: 'column', flexDirection: 'column', gap: '16px' }}>
                        <div>
                          <p style={{ fontSize: '0.8rem', color: 'var(--warning)', marginBottom: '10px' }}>
                            ⚠️ 아래 보고서 초안을 검토해 주세요. 피드백을 전달해 수정 요청을 하거나 최종 발행을 승인할 수 있습니다.
                          </p>
                          {Object.entries(recipeDraft).map(([sec, content]) => (
                            <div key={sec} className="report-section">
                              <div className="report-section-title">
                                {sec === 'analysis' && <><i className="fa-solid fa-chart-line"></i> [초안] 시장 분석 및 동향</>}
                                {sec === 'risks' && <><i className="fa-solid fa-triangle-exclamation"></i> [초안] 리스크 및 주요 요인</>}
                                {sec === 'opinion' && <><i className="fa-solid fa-comments"></i> [초안] 종합 투자의견</>}
                              </div>
                              <div className="report-section-content">{content}</div>
                            </div>
                          ))}
                        </div>

                        {/* Human feedback loop controls */}
                        <div className="feedback-box">
                          <div className="feedback-title">
                            <i className="fa-solid fa-comments-location"></i>
                            <span>초안 수정 피드백 또는 승인</span>
                          </div>
                          
                          <textarea
                            className="input-field"
                            value={feedback}
                            onChange={(e) => setFeedback(e.target.value)}
                            placeholder="보고서 초안에 수정 반영하고 싶은 요구사항을 입력해 주세요. (예: 위험 요인 분석에 고금리 기조 추가해줘)"
                            disabled={isActionLoading}
                            style={{ minHeight: '80px' }}
                          />
                          
                          <div style={{ display: 'flex', gap: '12px' }}>
                            <button
                              className="btn btn-secondary"
                              onClick={() => handleApproveAction(false)}
                              disabled={isActionLoading || !feedback.trim()}
                              style={{ flex: 1 }}
                            >
                              {isActionLoading && !feedback.trim() ? (
                                <i className="fa-solid fa-circle-notch fa-spin"></i>
                              ) : (
                                <><i className="fa-solid fa-pen-fancy"></i> 수정 요청</>
                              )}
                            </button>
                            
                            <button
                              className="btn btn-success"
                              onClick={() => handleApproveAction(true)}
                              disabled={isActionLoading}
                              style={{ flex: 1 }}
                            >
                              {isActionLoading && feedback.trim() === "" ? (
                                <i className="fa-solid fa-circle-notch fa-spin"></i>
                              ) : (
                                <><i className="fa-solid fa-check"></i> 최종 승인</>
                              )}
                            </button>
                          </div>
                        </div>
                      </div>
                    )}
                  </div>
                )}

                {/* Workflow graph display */}
                {activeTab === 'workflow' && (
                  <div>
                    <span className="input-label" style={{ marginBottom: '8px', display: 'block' }}>
                      <i className="fa-solid fa-route"></i> 실시간 랭그래프 흐름도
                    </span>
                    <div className="workflow-container">
                      <div id="mermaid-graph-container"></div>
                    </div>
                  </div>
                )}
              </div>
            )}
          </div>
        </div>
      </div>
    );
  }

  // Mount React app
  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(<App />);
</script>
