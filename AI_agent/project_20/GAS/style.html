<style>
  :root {
    --bg-primary: #080b11;
    --bg-secondary: #0f1422;
    --bg-tertiary: #171f35;
    --border-color: #232e48;
    --accent: #6366f1;
    --accent-glow: rgba(99, 102, 241, 0.15);
    --accent-secondary: #a855f7;
    --text-primary: #f8fafc;
    --text-secondary: #94a3b8;
    --success: #10b981;
    --warning: #f59e0b;
    --danger: #ef4444;
    --font-heading: 'Outfit', 'Noto Sans KR', sans-serif;
    --font-body: 'Inter', 'Noto Sans KR', sans-serif;
    --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
    --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
    --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: var(--font-body);
  }

  body {
    background-color: var(--bg-primary);
    color: var(--text-primary);
    line-height: 1.6;
    padding: 24px;
    display: flex;
    justify-content: center;
    min-height: 100vh;
  }

  .app-container {
    width: 100%;
    max-width: 1200px;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 28px;
    background: linear-gradient(135deg, var(--bg-secondary), #130f26);
    border: 1px solid var(--border-color);
    border-radius: 16px;
    box-shadow: var(--shadow-lg);
  }

  .header-logo {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .header-logo i {
    font-size: 2.2rem;
    color: var(--accent);
    text-shadow: 0 0 15px var(--accent);
  }

  .header-logo h1 {
    font-family: var(--font-heading);
    font-size: 1.6rem;
    font-weight: 800;
    letter-spacing: -0.5px;
    background: linear-gradient(to right, #818cf8, #c084fc);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .header-logo .subtitle {
    font-size: 0.85rem;
    color: var(--text-secondary);
    margin-top: 2px;
  }

  .header-actions {
    display: flex;
    gap: 12px;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 10px 18px;
    border-radius: 10px;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    transition: var(--transition);
    border: 1px solid transparent;
  }

  .btn-primary {
    background: linear-gradient(135deg, var(--accent), var(--accent-secondary));
    color: white;
    box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
  }

  .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(99, 102, 241, 0.55);
  }

  .btn-primary:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none;
    box-shadow: none;
  }

  .btn-secondary {
    background-color: var(--bg-tertiary);
    border-color: var(--border-color);
    color: var(--text-primary);
  }

  .btn-secondary:hover {
    background-color: #202b48;
    border-color: #3b4c73;
  }

  .btn-success {
    background-color: var(--success);
    color: white;
    box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
  }

  .btn-success:hover {
    background-color: #059669;
    transform: translateY(-1px);
    box-shadow: 0 6px 16px rgba(16, 185, 129, 0.5);
  }

  .btn-danger {
    background-color: var(--danger);
    color: white;
    box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
  }

  .btn-danger:hover {
    background-color: #dc2626;
    transform: translateY(-1px);
  }

  .btn-sm {
    padding: 6px 12px;
    font-size: 0.8rem;
    border-radius: 6px;
  }

  .settings-panel {
    background-color: var(--bg-secondary);
    border: 1px solid var(--border-color);
    border-radius: 16px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    animation: slideDown 0.3s ease-out;
  }

  @keyframes slideDown {
    from { opacity: 0; transform: translateY(-10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .form-group {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .form-label {
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .input-field {
    width: 100%;
    padding: 12px 16px;
    background-color: var(--bg-primary);
    border: 1px solid var(--border-color);
    border-radius: 10px;
    color: var(--text-primary);
    font-size: 0.95rem;
    transition: var(--transition);
  }

  .input-field:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-glow);
  }

  .input-field:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }

  .textarea-field {
    min-height: 120px;
    resize: vertical;
  }

  .grid-layout {
    display: grid;
    grid-template-columns: 1fr 2fr;
    gap: 24px;
  }

  @media (max-width: 900px) {
    .grid-layout {
      grid-template-columns: 1fr;
    }
  }

  .card {
    background-color: var(--bg-secondary);
    border: 1px solid var(--border-color);
    border-radius: 16px;
    padding: 24px;
    box-shadow: var(--shadow-md);
    display: flex;
    flex-direction: column;
    gap: 20px;
    position: relative;
    overflow: hidden;
  }

  .card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 4px;
    height: 100%;
    background: transparent;
  }

  .card.accented::before {
    background: linear-gradient(to bottom, var(--accent), var(--accent-secondary));
  }

  .card-title {
    font-family: var(--font-heading);
    font-size: 1.25rem;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--text-primary);
  }

  .card-title i {
    color: var(--accent);
  }

  .toggle-group {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .toggle-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px;
    background-color: var(--bg-tertiary);
    border: 1px solid var(--border-color);
    border-radius: 8px;
    font-size: 0.9rem;
    cursor: pointer;
    transition: var(--transition);
  }

  .toggle-item:hover {
    border-color: #3b4f7e;
    background-color: #1e2843;
  }

  .toggle-item.active {
    border-color: var(--accent);
    background-color: rgba(99, 102, 241, 0.08);
  }

  .toggle-item .badge {
    padding: 4px 8px;
    border-radius: 6px;
    font-size: 0.75rem;
    font-weight: 600;
    background-color: var(--border-color);
    color: var(--text-secondary);
  }

  .toggle-item.active .badge {
    background-color: var(--accent);
    color: white;
  }

  .radio-group {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }

  .radio-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 14px 10px;
    background-color: var(--bg-tertiary);
    border: 1px solid var(--border-color);
    border-radius: 10px;
    cursor: pointer;
    font-size: 0.85rem;
    font-weight: 600;
    text-align: center;
    transition: var(--transition);
  }

  .radio-card:hover {
    border-color: #3d5082;
    transform: translateY(-1px);
  }

  .radio-card.active {
    border-color: var(--accent);
    background-color: rgba(99, 102, 241, 0.1);
    box-shadow: 0 0 10px rgba(99, 102, 241, 0.15);
  }

  .radio-card.active i {
    color: var(--accent);
    text-shadow: 0 0 5px rgba(99, 102, 241, 0.4);
  }

  .radio-card i {
    font-size: 1.2rem;
    color: var(--text-secondary);
  }

  .logs-console {
    background-color: #04060b;
    border: 1px solid #161e31;
    border-radius: 12px;
    padding: 16px;
    font-family: 'Courier New', Courier, monospace;
    font-size: 0.85rem;
    color: #38bdf8;
    max-height: 250px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .log-line {
    display: flex;
    gap: 8px;
  }

  .log-timestamp {
    color: #64748b;
    flex-shrink: 0;
  }

  .log-text {
    word-break: break-all;
  }

  .log-text.info { color: #38bdf8; }
  .log-text.success { color: #4ade80; }
  .log-text.warning { color: #facc15; }
  .log-text.error { color: #f87171; }

  .doc-card {
    background-color: var(--bg-tertiary);
    border: 1px solid var(--border-color);
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 12px;
    font-size: 0.9rem;
    position: relative;
  }

  .doc-card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
    border-bottom: 1px solid var(--border-color);
    padding-bottom: 6px;
  }

  .doc-source {
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--accent);
    text-decoration: none;
  }

  .doc-source:hover {
    text-decoration: underline;
  }

  .doc-content {
    color: var(--text-secondary);
    font-size: 0.85rem;
    line-height: 1.5;
  }

  .approval-panel {
    border: 1px solid var(--warning);
    background-color: rgba(245, 158, 11, 0.05);
    border-radius: 14px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    animation: fadeIn 0.4s ease-out;
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  .tabs-container {
    display: flex;
    border-bottom: 1px solid var(--border-color);
    margin-bottom: 16px;
    gap: 8px;
  }

  .tab-button {
    padding: 10px 16px;
    background: none;
    border: none;
    color: var(--text-secondary);
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: var(--transition);
  }

  .tab-button:hover {
    color: var(--text-primary);
  }

  .tab-button.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }

  .tab-content {
    display: none;
    animation: fadeIn 0.3s ease-out;
  }

  .tab-content.active {
    display: block;
  }

  .markdown-content {
    background-color: var(--bg-primary);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    padding: 20px;
    overflow-x: auto;
    font-size: 0.95rem;
    color: #e2e8f0;
  }

  .markdown-content h1, 
  .markdown-content h2, 
  .markdown-content h3 {
    font-family: var(--font-heading);
    margin-top: 18px;
    margin-bottom: 8px;
    color: var(--text-primary);
  }

  .markdown-content h1 { font-size: 1.4rem; border-bottom: 1px solid var(--border-color); padding-bottom: 6px; }
  .markdown-content h2 { font-size: 1.2rem; }
  .markdown-content h3 { font-size: 1.05rem; }

  .markdown-content p {
    margin-bottom: 12px;
    line-height: 1.7;
  }

  .markdown-content ul, 
  .markdown-content ol {
    margin-left: 24px;
    margin-bottom: 12px;
  }

  .markdown-content li {
    margin-bottom: 6px;
  }

  .markdown-content blockquote {
    border-left: 4px solid var(--accent);
    padding-left: 14px;
    color: var(--text-secondary);
    margin: 12px 0;
  }

  .markdown-content code {
    font-family: monospace;
    background-color: var(--bg-secondary);
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 0.85rem;
  }

  .mermaid-card {
    background-color: #0b0f19;
    border: 1px solid var(--border-color);
    border-radius: 16px;
    padding: 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 250px;
  }

  #mermaid-graph-container {
    width: 100%;
    display: flex;
    justify-content: center;
    overflow-x: auto;
    padding: 10px;
  }

  .spinner {
    width: 40px;
    height: 40px;
    border: 3px solid rgba(255,255,255,0.08);
    border-radius: 50%;
    border-top-color: var(--accent);
    animation: spin 1s ease-in-out infinite;
    margin: 20px auto;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .badge-status {
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 0.8rem;
    font-weight: 700;
    text-transform: uppercase;
  }

  .badge-status.pending {
    background-color: rgba(245, 158, 11, 0.15);
    color: var(--warning);
    border: 1px solid rgba(245, 158, 11, 0.3);
  }

  .badge-status.completed {
    background-color: rgba(16, 185, 129, 0.15);
    color: var(--success);
    border: 1px solid rgba(16, 185, 129, 0.3);
  }

  .badge-status.idle {
    background-color: var(--border-color);
    color: var(--text-secondary);
  }
</style>
