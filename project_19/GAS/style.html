<style>
  :root {
    --bg-primary: #0b0f19;
    --bg-secondary: #131a2c;
    --bg-tertiary: #1e2942;
    --border-color: #2e3d5a;
    --accent: #3b82f6;
    --accent-glow: rgba(59, 130, 246, 0.15);
    --text-primary: #f8fafc;
    --text-secondary: #94a3b8;
    --success: #10b981;
    --warning: #f59e0b;
    --danger: #ef4444;
    --font-heading: 'Outfit', 'Noto Sans KR', sans-serif;
    --font-body: 'Inter', 'Noto Sans KR', sans-serif;
    --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
    --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: var(--font-body);
  }

  body {
    background-color: var(--bg-primary);
    color: var(--text-primary);
    line-height: 1.6;
    padding: 24px;
    display: flex;
    justify-content: center;
    min-height: 100vh;
  }

  .app-container {
    width: 100%;
    max-width: 1200px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 24px;
    background: linear-gradient(135deg, var(--bg-secondary), #1e1b4b);
    border: 1px solid var(--border-color);
    border-radius: 16px;
    box-shadow: var(--shadow-lg);
  }

  .header-logo {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .header-logo i {
    font-size: 2rem;
    color: var(--accent);
    text-shadow: 0 0 12px var(--accent);
  }

  .header-logo h1 {
    font-family: var(--font-heading);
    font-size: 1.4rem;
    font-weight: 700;
    letter-spacing: -0.5px;
    background: linear-gradient(to right, #60a5fa, #a78bfa);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .header-logo .subtitle {
    font-size: 0.8rem;
    color: var(--text-secondary);
  }

  .header-actions {
    display: flex;
    gap: 12px;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 10px 16px;
    border-radius: 8px;
    font-size: 0.9rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    border: 1px solid transparent;
  }

  .btn-primary {
    background-color: var(--accent);
    color: white;
    box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
  }

  .btn-primary:hover {
    background-color: #2563eb;
    transform: translateY(-1px);
    box-shadow: 0 6px 16px rgba(59, 130, 246, 0.4);
  }

  .btn-primary:disabled {
    background-color: #1d4ed8;
    opacity: 0.6;
    cursor: not-allowed;
    transform: none;
    box-shadow: none;
  }

  .btn-secondary {
    background-color: var(--bg-tertiary);
    border-color: var(--border-color);
    color: var(--text-primary);
  }

  .btn-secondary:hover {
    background-color: #2a3a5c;
    border-color: #4b6392;
  }

  .btn-success {
    background-color: var(--success);
    color: white;
    box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
  }

  .btn-success:hover {
    background-color: #059669;
    transform: translateY(-1px);
  }

  .btn-danger {
    background-color: var(--danger);
    color: white;
    box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
  }

  .btn-danger:hover {
    background-color: #dc2626;
    transform: translateY(-1px);
  }

  .btn-sm {
    padding: 6px 12px;
    font-size: 0.8rem;
  }

  .input-field {
    width: 100%;
    padding: 12px 16px;
    background-color: var(--bg-primary);
    border: 1px solid var(--border-color);
    border-radius: 8px;
    color: var(--text-primary);
    font-size: 0.95rem;
    transition: all 0.2s;
  }

  .input-field:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-glow);
  }

  .input-field:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }

  .textarea-field {
    min-height: 100px;
    resize: vertical;
  }

  .card {
    background-color: var(--bg-secondary);
    border: 1px solid var(--border-color);
    border-radius: 16px;
    padding: 24px;
    box-shadow: var(--shadow-md);
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .card-title {
    font-family: var(--font-heading);
    font-size: 1.15rem;
    font-weight: 600;
    color: var(--text-primary);
    display: flex;
    align-items: center;
    gap: 10px;
    border-bottom: 1px solid var(--border-color);
    padding-bottom: 12px;
  }

  .card-title i {
    color: var(--accent);
  }

  .main-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 20px;
  }

  @media (min-width: 900px) {
    .main-grid {
      grid-template-columns: 1fr 1.6fr;
    }
  }

  .input-group {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .input-label {
    font-size: 0.85rem;
    font-weight: 500;
    color: var(--text-secondary);
  }

  .switch-container {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 14px;
    background-color: var(--bg-tertiary);
    border: 1px solid var(--border-color);
    border-radius: 8px;
    margin-bottom: 8px;
  }

  .switch-label {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 0.9rem;
  }

  .switch-label i {
    color: var(--text-secondary);
  }

  /* Custom Switch Slider styling */
  .switch {
    position: relative;
    display: inline-block;
    width: 44px;
    height: 24px;
  }

  .switch input {
    opacity: 0;
    width: 0;
    height: 0;
  }

  .slider {
    position: absolute;
    cursor: pointer;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background-color: #374151;
    transition: .3s;
    border-radius: 24px;
  }

  .slider:before {
    position: absolute;
    content: "";
    height: 18px;
    width: 18px;
    left: 3px;
    bottom: 3px;
    background-color: white;
    transition: .3s;
    border-radius: 50%;
  }

  input:checked + .slider {
    background-color: var(--accent);
  }

  input:focus + .slider {
    box-shadow: 0 0 1px var(--accent);
  }

  input:checked + .slider:before {
    transform: translateX(20px);
  }

  .settings-card {
    animation: slideDown 0.25s ease-out;
  }

  @keyframes slideDown {
    from {
      opacity: 0;
      transform: translateY(-10px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .response-container {
    display: flex;
    flex-direction: column;
    gap: 16px;
    min-height: 200px;
  }

  .placeholder-text {
    color: var(--text-secondary);
    text-align: center;
    padding: 60px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }

  .placeholder-text i {
    font-size: 3rem;
    color: var(--border-color);
  }

  .spinner {
    width: 40px;
    height: 40px;
    border: 4px solid var(--border-color);
    border-top: 4px solid var(--accent);
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin: 20px auto;
  }

  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }

  .status-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    border-radius: 12px;
    font-size: 0.75rem;
    font-weight: 600;
    text-transform: uppercase;
  }

  .status-badge.pending {
    background-color: rgba(245, 158, 11, 0.15);
    color: var(--warning);
    border: 1px solid rgba(245, 158, 11, 0.3);
  }

  .status-badge.completed {
    background-color: rgba(16, 185, 129, 0.15);
    color: var(--success);
    border: 1px solid rgba(16, 185, 129, 0.3);
  }

  .chat-box {
    background-color: var(--bg-primary);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    padding: 16px;
    max-height: 240px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .chat-message {
    padding: 8px 12px;
    border-radius: 8px;
    max-width: 85%;
    font-size: 0.85rem;
  }

  .chat-message.user {
    background-color: var(--bg-tertiary);
    color: var(--text-primary);
    align-self: flex-start;
    border-left: 3px solid var(--accent);
  }

  .chat-message.assistant {
    background-color: #1e1b4b;
    color: #c084fc;
    align-self: flex-end;
    border-right: 3px solid #a78bfa;
  }

  .report-section {
    background-color: var(--bg-tertiary);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 12px;
    box-shadow: var(--shadow-sm);
  }

  .report-section-title {
    font-family: var(--font-heading);
    font-size: 1rem;
    font-weight: 600;
    color: #60a5fa;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .report-section-content {
    font-size: 0.9rem;
    color: var(--text-primary);
    white-space: pre-wrap;
  }

  .report-section-content ul, .report-section-content ol {
    margin-left: 20px;
    margin-bottom: 8px;
  }

  .report-section-content li {
    margin-bottom: 4px;
  }

  .report-section-content h3 {
    margin-top: 12px;
    margin-bottom: 6px;
    font-size: 0.95rem;
  }

  .workflow-container {
    background-color: #ffffff;
    padding: 16px;
    border-radius: 12px;
    border: 1px solid #e2e8f0;
    overflow-x: auto;
    display: flex;
    justify-content: center;
  }

  #mermaid-graph-container svg {
    max-width: 100%;
    height: auto;
  }

  .tab-headers {
    display: flex;
    border-bottom: 1px solid var(--border-color);
    margin-bottom: 14px;
    gap: 4px;
  }

  .tab-btn {
    padding: 8px 16px;
    background: none;
    border: none;
    color: var(--text-secondary);
    font-weight: 500;
    font-size: 0.9rem;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all 0.2s;
  }

  .tab-btn.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }

  .tab-btn:hover {
    color: var(--text-primary);
  }

  .feedback-box {
    background-color: rgba(245, 158, 11, 0.05);
    border: 1px solid rgba(245, 158, 11, 0.2);
    border-radius: 12px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .feedback-title {
    font-weight: 600;
    font-size: 0.95rem;
    color: var(--warning);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .db-seed-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background-color: rgba(59, 130, 246, 0.06);
    border: 1px solid rgba(59, 130, 246, 0.2);
    padding: 12px 18px;
    border-radius: 12px;
    font-size: 0.85rem;
  }
</style>
