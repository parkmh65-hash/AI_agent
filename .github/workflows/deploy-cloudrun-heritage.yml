name: Deploy FastAPI Backend to Google Cloud Run (Heritage)

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'heritage/ver_01/Server/**'
      - '.github/workflows/deploy-cloudrun-heritage.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy to Cloud Run
    runs-on: ubuntu-latest

    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Deploy to Google Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: heritage
          project_id: heritage-503408
          region: us-central1
          source: ./heritage/ver_01/Server
          flags: '--allow-unauthenticated'
          env_vars: |
            SUPABASE_URL=${{ secrets.SUPABASE_URL }}
            SUPABASE_KEY=${{ secrets.SUPABASE_KEY }}
            NEO4J_URI=${{ secrets.NEO4J_URI }}
            NEO4J_USER=${{ secrets.NEO4J_USER }}
            NEO4J_PASSWORD=${{ secrets.NEO4J_PASSWORD }}
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            DATA_GO_KR_API_KEY=${{ secrets.DATA_GO_KR_API_KEY }}

      - name: Print Completion Status
        run: echo "Cloud Run Service heritage successfully deployed to Google Cloud project!"
